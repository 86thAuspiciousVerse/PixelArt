<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixelart · 调参台</title>
<style>
  /* ══════════════════════════════════════════════════════════════════
     设计说明：暗房光学仪器台。

     一个功能性的硬约束决定了整个配色 —— **界面外壳必须是中性的**。
     这是个用来判断像素画**颜色**的工具；如果外壳带明显的色相，
     操作者的色感会被同时对比效应带偏（尤其相邻的取景框边缘）。
     所以：外壳一律近中性深灰，琥珀色只出现在仪表读数与操作控件上，
     绝不贴在画面旁边。

     字体同理不用网络字体：本地仪器就该离线可用，而且
     Bahnschrift（Windows 自带，源自 DIN 1451 工程字）比任何
     Google 字体都更贴"精密仪器"这个语境。数字用等宽，读数跳动时不会抖。
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --chassis:#0e0e10; --panel:#16161a; --raised:#1e1e23; --sunken:#0a0a0c;
    --line:#2a2a31; --line-hi:#3a3a44;
    --ink:#e8e6e0; --ink-2:#9d9a92; --ink-3:#6a6862;
    --amber:#e0a03a; --amber-dim:#8a6420; --amber-glow:rgba(224,160,58,.14);
    --ok:#6fae5c; --warn:#e0a03a; --bad:#cf5f4a;
    --ro-h:64px;   /* 仪表条高度：运行时被 #roHandle 拖拽覆盖并存 localStorage */
    --disp:"Bahnschrift","DIN Alternate","Archivo Narrow","Segoe UI Variable Display",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,ui-monospace,monospace;
    --rail:336px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--chassis); color:var(--ink);
    font-family:var(--disp); font-size:13px; line-height:1.5;
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* 底纹：极淡的像素网格 + 颗粒，交代"这是个像素工具"但不喧宾夺主 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:16px 16px;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse 120% 80% at 50% -10%,transparent 40%,rgba(0,0,0,.55) 100%);
  }

  /* ─────────────────────────── 台头 ─────────────────────────── */
  .masthead{
    position:relative; z-index:2; display:flex; align-items:center; gap:20px;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel),var(--chassis));
  }
  .brand{display:flex; align-items:baseline; gap:12px; flex:none}
  .brand h1{
    font-size:19px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  }
  .brand .mk{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--amber-dim);
    border:1px solid var(--line-hi); padding:2px 6px; border-radius:3px;
  }
  .brand .sub{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); letter-spacing:.06em}

  .picker{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
  /* 「素材」标签：把选择区的语义说清楚 —— 用户反馈这里原先不明确 */
  .picklabel{
    font-size:10px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--ink-3); flex:none;
  }
  .picker select{
    font-family:var(--mono); font-size:12px; color:var(--ink);
    background:var(--sunken); border:1px solid var(--line-hi); border-radius:4px;
    padding:6px 8px; min-width:210px; max-width:280px; cursor:pointer;
  }
  .picker select:hover{border-color:var(--amber-dim)}
  .picker select:focus{outline:none; border-color:var(--amber-dim); box-shadow:0 0 0 2px var(--amber-glow)}
  .picker .meta{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); white-space:nowrap}

  /* 缩略图做成按钮：明确「可点」 */
  .thumbwrap{
    position:relative; width:42px; height:42px; padding:0; flex:none;
    border:1px solid var(--line-hi); border-radius:3px; background:var(--sunken);
    cursor:pointer; overflow:hidden;
  }
  .thumbwrap:hover{border-color:var(--amber-dim)}
  .thumbwrap:hover .thumbhint{opacity:1}
  .thumb{width:100%; height:100%; object-fit:cover; image-rendering:pixelated; display:block}
  .thumbhint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:9.5px; letter-spacing:.08em; color:#1a1206; background:rgba(224,160,58,.9);
    opacity:0; transition:opacity .14s;
  }

  .acts{display:flex; align-items:center; gap:8px; flex:none}
  button{
    font-family:var(--disp); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-2); background:var(--raised); border:1px solid var(--line-hi);
    border-radius:4px; padding:7px 13px; cursor:pointer;
    transition:background .13s,color .13s,border-color .13s;
  }
  button:hover{background:#26262c; color:var(--ink); border-color:#4a4a56}
  button:active{transform:translateY(1px)}
  button.primary{
    color:#1a1206; background:var(--amber); border-color:#f0b34c; font-weight:500;
  }
  button.primary:hover{background:#f0b34c; color:#1a1206}
  button:disabled{opacity:.42; cursor:not-allowed; transform:none}

  /* ─────────────────────────── 工作台 ─────────────────────────── */
  .bench{
    position:relative; z-index:2; flex:1; display:grid;
    grid-template-columns:var(--rail) minmax(0,1fr); gap:1px;
    background:var(--line); min-height:0;
  }

  /* ── 滚动条：统一 WebKit 与 Firefox ──
     ⚠️ 左右两栏都必须套 .scroll。第一版只给左侧窄轨写了，
     右侧取景台的滚动条还是系统默认样式，两栏并排看着很割裂（用户指出）。 */
  .scroll{scrollbar-width:thin; scrollbar-color:#303038 var(--sunken)}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-track{background:var(--sunken)}
  .scroll::-webkit-scrollbar-thumb{
    background:#303038; border-radius:5px; border:2px solid var(--sunken);
  }
  .scroll::-webkit-scrollbar-thumb:hover{background:#43434f}
  .scroll::-webkit-scrollbar-thumb:active{background:var(--amber-dim)}
  .scroll::-webkit-scrollbar-corner{background:var(--sunken)}

  /* ── 左：控制窄轨（密集、可滚） ── */
  .rail{
    background:var(--panel); overflow-y:auto; padding:0 0 40px; min-height:0;
  }

  .grp{border-bottom:1px solid var(--line)}
  .grp > summary{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 16px; cursor:pointer; list-style:none;
    font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-2);
    transition:background .13s,color .13s;
  }
  .grp > summary:hover{background:#1a1a1f; color:var(--ink)}
  .grp > summary::-webkit-details-marker{display:none}
  .grp > summary::after{
    content:""; width:6px; height:6px; border-right:1.5px solid var(--ink-3);
    border-bottom:1.5px solid var(--ink-3); transform:rotate(45deg) translateY(-2px);
    transition:transform .16s;
  }
  .grp[open] > summary::after{transform:rotate(-135deg) translateY(-1px)}
  .grp[open] > summary{color:var(--amber)}
  .grp .body{padding:4px 16px 15px}

  .row{margin:9px 0}
  .row .lab{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:4px}
  .row .lab span:first-child{font-size:12px; color:var(--ink-2)}
  .row .val{
    font-family:var(--mono); font-size:11.5px; color:var(--amber);
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  .row .hint{
    font-family:var(--mono); font-size:10px; color:var(--ink-3); margin-top:3px;
    letter-spacing:.01em; line-height:1.45;
  }
  .row .hint.warn{color:#b07b3a}

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:18px;
    background:transparent; cursor:ew-resize; display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:3px; background:var(--sunken); border:1px solid var(--line); border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:15px; margin-top:-7px;
    background:var(--ink-2); border:1px solid #0a0a0c; border-radius:2px;
    transition:background .12s;
  }
  input[type=range]:hover::-webkit-slider-thumb{background:var(--amber)}
  input[type=range]::-moz-range-track{height:3px;background:var(--sunken);border:1px solid var(--line)}
  input[type=range]::-moz-range-thumb{width:10px;height:15px;background:var(--ink-2);border:1px solid #0a0a0c;border-radius:2px}

  select.mini, input.mini{
    font-family:var(--mono); font-size:11.5px; color:var(--ink); width:100%;
    background:var(--sunken); border:1px solid var(--line-hi); border-radius:3px;
    padding:5px 7px;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}

  /* 开关 */
  .sw{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    padding:5px 0; font-size:11.5px; color:var(--ink-2);
  }
  .sw input{display:none}
  .sw i{
    width:30px; height:16px; border-radius:9px; background:var(--sunken);
    border:1px solid var(--line-hi); position:relative; transition:background .15s,border-color .15s; flex:none;
  }
  .sw i::after{
    content:""; position:absolute; top:1.5px; left:1.5px; width:11px; height:11px;
    border-radius:50%; background:var(--ink-3); transition:transform .15s,background .15s;
  }
  .sw input:checked + i{background:var(--amber-glow); border-color:var(--amber-dim)}
  .sw input:checked + i::after{transform:translateX(14px); background:var(--amber)}
  .sw.wide{flex:1}

  .colorrow{display:flex; align-items:center; gap:9px; margin:7px 0}
  .colorrow input[type=color]{
    -webkit-appearance:none; appearance:none; width:38px; height:24px; padding:0;
    background:none; border:1px solid var(--line-hi); border-radius:3px; cursor:pointer; flex:none;
  }
  .colorrow input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .colorrow input[type=color]::-webkit-color-swatch{border:1px solid #000;border-radius:2px}
  .colorrow .chex{font-family:var(--mono); font-size:11px; color:var(--ink-2)}
  .colorrow.auto{opacity:.4; pointer-events:none}

  /* ── 右：取景台（主导，粘性） ── */
  .stagecol{
    background:var(--chassis); overflow-y:auto; padding:20px 24px 28px; min-height:0;
    display:flex; flex-direction:column; gap:16px;
  }  /* 取景台：可滚动，内容用 margin:auto 居中（这样放大超出时不会裁掉左上角） */
  .stage{
    position:relative; background:var(--sunken);
    border:1px solid var(--line-hi); border-radius:5px;
    padding:14px; display:flex; overflow:hidden; flex:1; min-height:420px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), 0 18px 44px -22px #000;
  }
  /* ⚠️ 画布式查看后这里**不能再有滚动**：平移走 #world 的 transform，
     badge/plate 绝对定位在本层——若保留滚动它们会跟着内容"飞走"。
     原来那条「载入扫光」::after 动画也删了：fill-mode:both 让它永久停在
     top:104%，画布往下拖会拖进这条停泊的琥珀光带（用户实测的"黄色光晕"）。 */
  .stage.zoomed{cursor:grab}

  /* ⚠️ 显示尺寸**只由 JS 按「网格 × 整数缩放档」设定**，绝不用 max-width 兜底。
     踩过的坑：原来 img 用 max-width:100%，于是拖动参数时（为了提速渲半分辨率）
     图片显示尺寸跟着变小、播放时又变大 —— 画面一直在跳。
     根因是显示尺寸被**渲染分辨率**牵着走，而不是被**逻辑尺寸**决定。
     现在 width/height 由 JS 明确设定，渲染分辨率怎么变都不影响显示大小。 */
  .stagebox{position:relative; margin:auto; flex:none; line-height:0}
  /* 画布：它的**后备缓冲**就是像素网格尺寸，CSS 尺寸由 JS 设成网格×整数倍。
     所以它是 1:1 上屏的（不缩放），像素方块天然方正。 */
  .stagebox canvas{
    display:none; width:100%; height:100%; background:#000;
    box-shadow:0 0 0 1px #000; image-rendering:pixelated;
  }
  /* GPU 后端接管时用画布，服务端后端继续用 img。
     两者**互斥显示**，但共用同一个 stagebox 的尺寸逻辑 ——
     所以切换后端不会让画面尺寸跳一下。 */
  .stagebox.gpu img{display:none}
  .stagebox.gpu canvas{display:block}
  /* 调试图：与主画面**同一个取景框**，由世界层 #world 统一承载。
     布局：0 张独占居中；1-2 张一行并排（渲染图最左）；3 张 2×2（渲染图左上）。
     查看 = 画布：滚轮以**光标为不动点**缩放（滚动补偿）、中键拖动平移。
     ⚠️ cell 必须 flex:none —— flex 默认 shrink 会把固定宽的图压出"外冒容器"。 */
  .debugbar{display:flex;gap:12px;align-items:center;justify-content:center;
    margin-top:8px;font-size:11px;color:var(--ink-2)}
  .debugbar .dtag{font-weight:500;letter-spacing:.05em}
  #world{display:flex;gap:12px;width:max-content;height:max-content;
    align-items:flex-start}
  #world.quad{display:grid;grid-template-columns:repeat(2,max-content);align-content:start}
  #world .dbgcell{position:relative;line-height:0;flex:none}
  #world .dbgcell img{height:auto;display:block}
  #world .dbgcell .cap{position:absolute;left:4px;top:4px;font-size:10px;
    background:rgba(15,15,15,.75);color:#ddd;padding:1px 7px;border-radius:4px;line-height:1.7}
  .stage.panning, .stage.zoomed.panning{cursor:grabbing}
  .stagebox img{
    display:block; width:100%; height:100%;
    image-rendering:pixelated; background:#000; box-shadow:0 0 0 1px #000;
  }
  /* 帧号牌压在画面角上（有意破格，不占版面） */
  .frameplate{
    position:absolute; right:24px; bottom:24px; z-index:3;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
    color:var(--amber); background:rgba(10,10,12,.82);
    border:1px solid var(--amber-dim); border-radius:3px; padding:3px 8px;
    opacity:0; transition:opacity .2s;
  }
  .frameplate.on{opacity:1}
  .badge{
    position:absolute; left:24px; top:22px; z-index:3;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.07em;
    border:1px solid var(--line-hi); border-radius:3px; padding:3px 8px;
    background:rgba(10,10,12,.82); color:var(--ink-2);
    opacity:0; transition:opacity .2s;
  }
  .badge.on{opacity:1}
  .badge.busy{color:var(--amber); border-color:var(--amber-dim)}

  .scrub{display:flex; align-items:center; gap:12px}
  .scrub input[type=range]{flex:1}
  /* 后端指示/切换：与工具条其它按钮同风格，但用颜色区分状态 */
  .scrub button.be{
    color:var(--ok) !important; border-color:var(--ok) !important;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.02em;
  }
  .scrub button.be.server{color:var(--ink-3) !important;
                          border-color:var(--line-hi) !important}
  .scrub button.be.bad{color:var(--bad) !important; border-color:var(--bad) !important}
  .scrub .t{font-family:var(--mono); font-size:11px; color:var(--ink-3);
            font-variant-numeric:tabular-nums; white-space:nowrap}

  /* 缩放控件：默认「适应」，滚轮或 ± 之后就固定下来（不再随窗口变化） */
  .zoombox{
    display:flex; align-items:center; gap:4px; flex:none;
    border:1px solid var(--line); border-radius:4px; background:var(--sunken);
    padding:2px;
  }
  .zoombox button{
    padding:3px 7px; font-size:11px; letter-spacing:0; text-transform:none;
    border-color:transparent; background:transparent; color:var(--ink-2);
  }
  .zoombox button:hover{background:var(--raised); color:var(--ink); border-color:var(--line-hi)}
  .zoombox #zoomTag{
    font-family:var(--mono); font-size:11px; color:var(--amber);
    font-variant-numeric:tabular-nums; min-width:44px; text-align:center;
    padding:0 2px; cursor:default;
  }
  .zoombox #zoomTag.auto{color:var(--ink-3)}
  .zoombox #btnZoomFit{padding:3px 8px}

  /* 扫描台 */
  .sweep{border:1px solid var(--line); border-radius:5px; background:var(--panel); overflow:hidden}
  .sweep > summary{
    padding:10px 16px; cursor:pointer; list-style:none;
    display:flex; align-items:center; gap:14px;
    font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-2);
  }
  .sweep > summary::-webkit-details-marker{display:none}
  .sweep > summary:hover{background:#1a1a1f;color:var(--ink)}
  .sweep[open] > summary{color:var(--amber); border-bottom:1px solid var(--line)}
  .sweep .body{padding:14px 16px; display:flex; flex-direction:column; gap:12px}
  .sweep .ctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .sweep img{width:100%; display:block}
  /* ⭐ 扫描结果自己滚 —— 旧版直接塞在栏目流里，被视口底边裁掉一半 */
  .sweepOut{
    max-height:46vh; overflow:auto; border:1px solid var(--line);
    border-radius:3px; background:var(--sunken);
  }
  .sweep .chips{display:flex; gap:8px; flex-wrap:wrap}
  .sweep .chips button{padding:3px 10px; font-family:var(--mono); font-size:11px}
  .sweep .chips button:hover{border-color:var(--amber); color:var(--amber)}

  /* ─────────────────────────── 仪表读数条 ───────────────────────────
   *
   * ⭐ 高度与每栏宽度都**可拖拽**（用户要求）：
   *    · 总高度 —— 拖 `#roHandle`（仪表条顶边），写入 --ro-h，存 localStorage
   *    · 每栏宽度 —— 拖栏与栏之间的 `.ro-div` 分割线，按栏名存 localStorage
   *    · 横向放不下时**滚动**而不是吞掉内容（旧版会直接截断）
   */
  #roHandle{
    height:5px; cursor:ns-resize; background:#2a2a31;
    border-top:1px solid var(--line-hi);
  }
  #roHandle:hover{background:var(--amber-dim)}
  .readout{
    position:relative; z-index:2; display:flex; align-items:stretch; gap:1px;
    background:var(--line); border-top:1px solid var(--line-hi);
    height:var(--ro-h, 64px); min-height:36px;
    overflow-x:auto; overflow-y:hidden;
  }
  .cell{
    flex:1 1 0; min-width:96px; background:linear-gradient(180deg,var(--raised),var(--panel));
    padding:8px 14px; display:flex; flex-direction:column; gap:3px;
    /* ⭐ 按用户要求：文字要感知可用高度 —— 高度拖大就换行显示更多内容，
     *    高度小时多余行被裁掉（而不是永远单行省略号）。 */
    overflow:hidden; min-height:0;
  }
  .ro-div{
    flex:0 0 7px; cursor:ew-resize; background:var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .ro-div::after{content:""; width:1px; height:26px; background:#3a3a44}
  .ro-div:hover{background:var(--amber-dim)}
  .ro-div:hover::after{background:var(--amber)}
  .cell .k{
    font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
  }
  .cell .v{
    font-family:var(--mono); font-size:14px; color:var(--ink);
    font-variant-numeric:tabular-nums; letter-spacing:.01em;
    /* ⭐ 随可用高度自动换行：拖高仪表条能看到更多行，超出部分裁掉 */
    white-space:normal; word-break:break-word; overflow:hidden;
  }
  .cell .v.ok{color:var(--ok)} .cell .v.bad{color:var(--bad)} .cell .v.warn{color:var(--warn)}
  /* 幅度条：三段一眼看出动得够不够 */
  .amp{display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--sunken); margin-top:1px}
  .amp i{display:block; height:100%}
  .amp .s{background:#2b2b33} .amp .f{background:#4a4232} .amp .v{background:#8a6420} .amp .g{background:var(--amber)}

  /* 光源位置标记：叠在画面上，随 XY 滑杆实时移动 */
  .marker{
    position:absolute; z-index:4; width:0; height:0; pointer-events:none;
    opacity:0; transition:opacity .16s;
  }
  .marker.on{opacity:1}
  .marker i{
    position:absolute; display:block; background:var(--amber);
    box-shadow:0 0 0 1px rgba(10,10,12,.85);
  }
  .marker .ring{
    width:46px; height:46px; left:-23px; top:-23px; background:none;
    border:1px dashed var(--amber); border-radius:50%;
    box-shadow:0 0 0 1px rgba(10,10,12,.7), inset 0 0 0 1px rgba(10,10,12,.45);
    animation:ring 2.4s ease-in-out infinite;
  }
  .marker .dot{width:7px; height:7px; left:-3.5px; top:-3.5px; border-radius:50%}
  .marker .h{width:30px; height:1px; left:-15px; top:0}
  .marker .v{width:1px; height:30px; left:0; top:-15px}
  .marker .tag{
    position:absolute; left:30px; top:-32px; white-space:nowrap;
    font-family:var(--mono); font-size:10px; letter-spacing:.05em;
    color:var(--amber); background:rgba(10,10,12,.85);
    border:1px solid var(--amber-dim); border-radius:3px; padding:2px 6px;
  }
  @keyframes ring{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.14);opacity:.5}}
  /* 副光源标记：同一套形状，**青色系**与主光（琥珀）区分；无准线（那是主光专属） */
  .marker.m2 i{background:#4ecdc4}
  .marker.m2 .ring{border-color:#4ecdc4}
  .marker.m2 .tag{color:#4ecdc4; border-color:#0f6e56}

  /* 贯穿全图的十字准线：光靠一个点看不出 X/Y 到底在哪一列/哪一行。
     拖滑杆时它**实时跟随**（在滑杆的 oninput 里就更新，不等渲染返回）。 */
  .crosshair{
    position:absolute; z-index:3; pointer-events:none; opacity:0;
    transition:opacity .16s;
    background:repeating-linear-gradient(from 0deg,
      var(--amber) 0 2px, transparent 2px 6px);
  }
  .crosshair.on{opacity:.42}
  .crosshair.h{left:0; right:0; height:1px;
    background:repeating-linear-gradient(to right,
      var(--amber) 0 2px, transparent 2px 6px)}
  .crosshair.v{top:0; bottom:0; width:1px;
    background:repeating-linear-gradient(to bottom,
      var(--amber) 0 2px, transparent 2px 6px)}
  /* 边缘刻度：把 X / Y 的数值钉在贴边处，视线不用来回找 */
  .crosshair.h::after, .crosshair.v::after{
    position:absolute; font-family:var(--mono); font-size:9.5px;
    color:var(--amber); background:rgba(10,10,12,.85);
    border-radius:2px; padding:1px 4px; letter-spacing:.04em;
  }
  .crosshair.h::after{content:attr(data-v); left:4px; top:-8px}
  .crosshair.v::after{content:attr(data-v); top:4px; left:-8px}

  .toast{
    position:fixed; left:50%; bottom:74px; transform:translate(-50%,14px); z-index:50;
    background:var(--raised); border:1px solid var(--line-hi); border-left:2px solid var(--amber);
    border-radius:4px; padding:10px 16px; font-size:12px; color:var(--ink);
    opacity:0; pointer-events:none; transition:opacity .2s,transform .2s;
    box-shadow:0 12px 32px -12px #000; max-width:min(560px,86vw);
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}
  .toast.bad{border-left-color:var(--bad)}
  .toast.ok{border-left-color:var(--ok)}

  /* 拖放提示：整屏覆盖，明确告诉用户「可以松手了」 */
  .dropzone{
    position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center;
    background:rgba(10,10,12,.86); backdrop-filter:blur(2px);
  }
  .dropzone.on{display:flex}
  .dropzone .inner{
    border:2px dashed var(--amber-dim); border-radius:12px;
    padding:52px 76px; text-align:center; background:rgba(22,22,26,.9);
  }
  .dropzone h2{font-size:17px; font-weight:500; color:var(--amber); letter-spacing:.06em}
  .dropzone p{margin-top:8px; font-family:var(--mono); font-size:11.5px; color:var(--ink-2)}

  /* 载入时控件的参差入场（只此一处动效，不做零散的 hover 抖动） */
  .stagger{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
  @media (max-width:1080px){
    :root{--rail:290px}
    /* ⚠️ 这里原来有一条 `.stage img{max-height:52vh}` —— 已删除。
       它属于"显示尺寸由 CSS 决定"的旧设计，会和 JS 设定的取景框尺寸打架，
       在窄窗口下把画面压扁。尺寸只由「网格 × 整数 zoom」决定（见 applyZoom）。 */
  }
</style>

<body>

<header class="masthead">
  <div class="brand">
    <h1>pixelart</h1>
    <span class="mk">M3</span>
    <span class="sub">调参台</span>
  </div>
  <div class="picker">
    <span class="picklabel">素材</span>
    <button class="thumbwrap" id="thumbBtn" title="点击更换素材">
      <img class="thumb" id="thumb" alt="">
      <span class="thumbhint">更换</span>
    </button>
    <select id="asset" title="选择素材"></select>
    <span class="meta" id="assetMeta"></span>
    <button id="btnUpload" title="上传你自己的图片（也可以直接拖到画面上）">上传图片…</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>
  <div class="acts">
    <button id="btnPreview">渲染预览</button>
    <button id="btnReset">复位</button>
    <button id="btnSave">存参数</button>
    <button id="btnLoad">取参数</button>
    <button id="btnExport" class="primary">全量出图</button>
    <button id="btnLang" title="切换界面语言 / Switch UI language">EN</button>
  </div>
</header>

<main class="bench">
  <aside class="rail scroll" id="rail"></aside>

  <section class="stagecol scroll" id="stagecol">
    <div class="stage">
      <span class="badge" id="badge"></span>
      <span class="frameplate" id="plate">— / —</span>
      <div id="world">
        <span class="stagebox" id="stagebox">
          <img id="frame" alt="预览">
          <canvas id="gpuCanvas"></canvas>
          <i class="crosshair h" id="chH"></i>
          <i class="crosshair v" id="chV"></i>
          <span class="marker" id="marker">
            <i class="ring"></i><i class="h"></i><i class="v"></i><i class="dot"></i>
            <span class="tag" id="markerTag">光源 自动</span>

          <span class="marker m2" id="marker2">
            <i class="ring"></i><i class="dot"></i>
            <span class="tag" id="marker2Tag">副光源</span>
          </span>
        </span>
      </div>
    </div>
    <div class="debugbar">
      <span class="dtag">调试图</span>
      <label class="sw" title="暗=近、蓝=远。雾/体积光/视差的共同根，深度估计的灾难在这里一眼可见">
        <input type="checkbox" id="dbgDepth"><i></i><span>深度图</span></label>
      <label class="sw" title="模糊亮度 + 90/95/99 分位等亮线（蓝/橙/红）。光源检测的输入：亮核在哪、集不集中">
        <input type="checkbox" id="dbgLuma"><i></i><span>等亮线</span></label>
      <label class="sw" title="体积光形状（归一化增强）。调光锥张角/方向/光柱时看几何，不被量化骗">
        <input type="checkbox" id="dbgVol"><i></i><span>体积光</span></label>
    </div>
    <div class="scrub">
      <button id="btnPlay">播放</button>
      <input type="range" id="scrub" min="0" max="0" value="0" step="1">
      <span class="t" id="scrubT">t = 0.00</span>
      <label class="sw" title="在画面上标出光源位置">
        <input type="checkbox" id="showMarker"><i></i>
        <span style="font-size:11px;white-space:nowrap">光源</span>
      </label>
      <button id="btnBackend" class="be" title="切换渲染后端">后端：检测中…</button>
      <span class="zoombox">
        <button id="btnZoomOut" title="缩小（滚轮也可）">−</button>
        <span id="zoomTag" title="当前显示倍率">—</span>
        <button id="btnZoomIn" title="放大（滚轮也可）">+</button>
        <button id="btnZoomFit" title="恢复自适应（按窗口大小自动选整数倍）">适应</button>
      </span>
    </div>

    <details class="sweep">
      <summary>参数扫描 · 同一画面并排对比多个取值</summary>
      <div class="body">
        <div class="ctl">
          <select class="mini" id="sweepKey" style="max-width:230px"></select>
          <input class="mini" id="sweepVals" value="0.4, 0.7, 1.1, 1.4" style="flex:1;min-width:180px">
          <button id="btnSweep">扫描</button>
        </div>
        <div class="hint" style="font-size:11px;color:var(--ink-2);line-height:1.7">
          这是<b>挑「口味」参数</b>用的：选一个参数、给几个取值（逗号分隔，最多 8 个），
          服务端会用<b>当前的其它参数</b>把同一帧的每个取值版各渲一遍、并排对比 ——
          一眼看出「色板数 16 和 32 差多少」「雾浓度多高开始发灰」这类没有对错、只有喜好的问题。
          扫描<b>不会改动</b>当前参数；看完点下方取值条即可把某个值应用过来。
        </div>
        <div class="chips" id="sweepChips"></div>
        <div class="sweepOut scroll"><img id="sweepImg" style="display:none" alt="参数扫描结果（每个取值一列，左起第三个是当前值加亮）"></div>
      </div>
    </details>
  </section>
</main>

<div id="roWrap">
  <div id="roHandle" title="上下拖动调整仪表条高度；双击复位"></div>
  <footer class="readout scroll" id="readout"></footer>
</div>
<div class="toast" id="toast"></div>
<div class="dropzone" id="dropzone">
  <div class="inner">
    <h2>松手以载入这张图片</h2>
    <p>支持 JPG / PNG / WebP / BMP / TIFF / GIF</p>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* ── 参数表：界面上的每个控件都由这里生成，避免手写 30 个滑杆 ── */
const SPEC = [
  {g:"网格与质量", open:true, rebuild:true, rows:[
    {k:"grid_long", t:"网格长边", min:160, max:480, step:16,
     hint:"像素网格密度。480 是密集场景「结构可读」的下限（放大 ×4）；预览降到 240 提速 4 倍。"},
    {k:"work_long", t:"工作分辨率", min:480, max:1920, step:160,
     hint:"必须是网格的整数倍，否则方块参差。自动取网格 ×4。"},
    {k:"aspect", t:"画面比例", type:"select",
     opts:[["native","保持原比例"],["16:9","16:9"],["2.16","2.16"],["1:1","1:1"]],
     hint:"竖构图务必用「保持原比例」，裁成 16:9 会毁掉大半画面。"},
  ]},
  {g:"预处理", open:false, rebuild:true, rows:[
    {k:"levels", t:"自动色阶", min:0, max:1, step:.05,
     hint:"低对比素材（夜景/雾天）必须先拉色阶，否则色板被浪费在同色暗部上。"},
    {k:"sharpen", t:"锐化 USM", min:0, max:1.2, step:.05,
     hint:"让相邻方块的反差立起来。必须在量化之前做。>0.8 会出振铃。"},
    {k:"var_gain", t:"边缘保留", min:0, max:120, step:5,
     hint:"结构感知降采样的权重增益。越大越保细节，也越容易出噪点。"},
    {k:"detail", t:"细节预算", min:0, max:1, step:.05,
     hint:"⭐ 低网格救细节的一档：忙碌格子不再取平均值，而是偏向格内最出挑的细节像素（细线、五官、小字）。平坦区不受影响。0 = 关闭；240 网格收益最大，高网格可以不开。"},
  ]},
  {g:"天空替换", open:false, rebuild:true, rows:[
    {k:"sky_on", t:"天空替换", type:"bool",
     hint:"⭐ 画面里有天空时（深度 ≥ 0.985 且占比 ≥ 2% 才触发），把噪脏的天空换成程序化渐变 + 星场。室内图永远不会触发。在场景构建阶段生效，CPU/GPU 渲染一致。"},
    {k:"sky_mode", t:"天空预设", type:"select",
     opts:[["night","夜空 + 星场"],["dusk","暮色 + 稀星"],["day","白昼"]],
     hint:"夜空：深蓝渐变 + 密集星场；暮色：紫橙渐变 + 稀星；白昼：浅蓝渐变、无星。"},
    {k:"sky_stars", t:"星密度", min:0, max:2, step:.1,
     hint:"星星密度倍率。0 = 无星，1 = 标准，2 = 密集。只对夜空/暮色生效。"},
  ]},
  {g:"雾（空气透视）", open:true, rows:[
    {k:"density", t:"雾浓度", min:0, max:2, step:.05, hint:"⚠️ 可用区间很窄"},
    {k:"power", t:"距离幂次", min:1, max:5, step:.25,
     hint:"<2 中景就发灰、画面会「糊」。经验值 3。"},
    {k:"_fogColor", t:"雾色", type:"color", auto:k=>k.fog_r<0,
     _c:["fog_r","fog_g","fog_b"],
     hint:"自动值取远景的「中位数」（不是均值，会被光轴带跑）。"},
    {k:"fog_tint", t:"雾的上色", min:0, max:1, step:.05,
     hint:"⭐ 控制「整幅图被拉向一个主题色」的强度：1 = 现状（雾色与光柱完全上色）；0 = 雾与光柱去色为中性灰 —— 空气透视的远近明暗保留，但**不改变任何色相**，色彩层次全保留。想保留原始色彩就往 0 拖。"},
    {k:"fog_sat", t:"雾色饱和度上限", min:0, max:0.8, step:.05,
     hint:"⚠️ 雾覆盖全部远景，过饱和就等于给远景蒙一层滤镜。不少图片的自动雾色饱和度偏高（极端可到 0.79）。0.40 是经验上限：只对过饱和的雾色生效，其余图片完全不受影响，暖度保留。0 = 不压。"},
  ]},
  {g:"体积光与辉光", open:true, rows:[
    {k:"rays", t:"体积光强度", min:0, max:1.5, step:.05},
    {k:"rays_sat", t:"散射色饱和度上限", min:0, max:.6, step:.05,
     hint:"⚠️ 空气散射近乎无色。实测 0.25 是拐点：0.15 会把暖色光抽灰。"},
    {k:"rays_spread", t:"光源影响范围收敛", min:0, max:2, step:.1,
     hint:"⚠️ 0 = 全图均匀叠加（旧行为，像蒙滤镜）。>0 按屏幕距离收敛，光更像从那一点发出来。实测 1.0 让近处占比 53%→69%。"},
    {k:"rays_cone", t:"光锥张角", min:0, max:1.2, step:.05,
     hint:"0 = 关闭（现在的径向光晕）。>0 时把光塑成锥形：锥内亮、锥外不亮、边缘平滑 —— 配合已有的深度遮挡就会切出直边与硬阴影，这是「光柱」观感的来源。0.5~0.8 起步。"},
    {k:"rays_shaft", t:"光柱强度", min:0, max:2, step:.1,
     hint:"⭐ 让光柱真的看得见的那一档。光锥（张角）只负责「塑形」，但体积光整层本身非常微弱，塑形塑不出东西 —— 这个参数是独立的加性层：锥内的空气被照亮（沿柱均匀、随距离衰减、被屏幕阴影切断），自带强度。0.5~1.0 起步；⚠️ 0 = 关闭。"},
    {k:"rays_dir", t:"光锥方向", min:-180, max:180, step:5,
     hint:"锥轴方向角（度）。屏幕坐标 y 向下：90 = 向下（灯在头顶往下照）、0 = 向右、-90 = 向上。改方向比改张角更能改变观感。"},
    {k:"cone_x", t:"锥顶点X", min:-1, max:1, step:.01,
     hint:"⭐ 锥形与光柱的顶点位置。-1 = 跟随光源（默认，与旧行为一致）；≥0 = 独立放置，允许出画（如太阳在画外的穿窗光束：亮块留在窗上，锥顶点拖到画外）。遮挡与衰减仍以光源为准。"},
    {k:"cone_y", t:"锥顶点Y", min:-1, max:1, step:.01,
     hint:"⭐ 同上（纵轴）。配合「体积光」调试图使用最直观：调试图会同时画出光源（绿）与锥顶点（橙）两个十字。"},
    {k:"light2_on", t:"副光源", type:"bool",
     hint:"⭐ 双光源：副光源在自己的邻域自动采样散射色（屏幕偏冷、灯泡偏暖，不用手动调色），线性加法混合（物理正确：辐照度直接相加），带各自的深度遮挡与阴影。开启后画面上会标出青色十字。"},
    {k:"light2_x", t:"副光X", min:0, max:1, step:.01,
     hint:"副光源位置（横向）。"},
    {k:"light2_y", t:"副光Y", min:0, max:1, step:.01,
     hint:"副光源位置（纵向）。"},
    {k:"light2_gain", t:"副光强度", min:0, max:3, step:.1,
     hint:"副光源的体积光注入强度。0.5~1.5 起步；两盏都开时注意总注入量（叠加后更容易过曝）。"},
    {k:"light2_spread", t:"副光范围", min:0, max:2, step:.1,
     hint:"副光源的影响范围收敛：0 = 全图均匀叠加（旧滤镜感），>0 按屏幕距离收敛。"},
    {k:"rays_reach", t:"光锥长度", min:0, max:1, step:.05,
     hint:"1 = 几乎不额外衰减；小值让光柱在画面内就淡掉（「打不到底」的观感）。"},
    {k:"rays_cone_gain", t:"锥内增益", min:1, max:3, step:.1,
     hint:"光柱要的是「锥内空气比锥外亮」。实测只靠「锥外减掉」几乎看不出（开/关只差 1.8/255，因为体积光本身注入量就小），所以锥内要有乘性增益。1.6 起步。"},
    {k:"_light", t:"光源位置", type:"vec2", auto:k=>k.rays_auto_center,
     _auto:"rays_auto_center", _c:["rays_x","rays_y"],
     hint:"⚠️ 自动检测常落错地方（实测会落在草丛与地面反光上），务必目视核对。"},
    {k:"_raysColor", t:"散射色", type:"color", auto:k=>k.rays_r<0,
     _c:["rays_r","rays_g","rays_b"]},
    {k:"bloom", t:"辉光", min:0, max:2, step:.05},
  ]},
  {g:"像素尾巴", open:false, rows:[
    {k:"quantize_mode", t:"取色模式", type:"select",
     opts:[["palette","色板吸附（像素画）"],["continuous","连续色（高保真）"]],

 * ══════════════════════════════════════════════════════════════════ */
const PAGE_STATE = { t0: Date.now(), href: location.search || "(无参数)", steps: [], errors: [] };
/* ⚠️ 本次运行的标识。体检工具每次带一个一次性 token 打开页面，
 *    靠它认出"这份报告是这一轮的" —— 于是**不需要删除旧报告**
 *    （删除是危险操作，而且要额外权限；用一个 token 更干净、也更可靠）。 */
PAGE_STATE.run = new URLSearchParams(location.search).get("bootcheck") || "";
let _psTimer = 0;

function psFlush(){
  clearTimeout(_psTimer);
  _psTimer = setTimeout(() => {
    try {
      fetch("/api/params", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: "_page_state", params: PAGE_STATE })
      }).catch(() => {});
    } catch (e) { /* 回报失败不能影响页面 */ }
  }, 150);
}

function ps(step, extra){
  const e = { ms: Date.now() - PAGE_STATE.t0, step };
  if (extra) e.d = extra;
  PAGE_STATE.steps.push(e);
  if (PAGE_STATE.steps.length > 60) PAGE_STATE.steps.shift();
  psFlush();
}

function psErr(kind, msg){
  PAGE_STATE.errors.push({ ms: Date.now() - PAGE_STATE.t0, kind, msg: String(msg).slice(0, 500) });
  if (PAGE_STATE.errors.length > 20) PAGE_STATE.errors.shift();
  psFlush();
}

/* ⚠️ 全局兜底。这两条能抓住"抛在 async 里没人接"的错误 ——

window.addEventListener("error", (ev) => {
  const f = (ev.filename || "").split("/").pop();
  psErr("error", `${ev.message} @ ${f}:${ev.lineno}:${ev.colno}`);
});
window.addEventListener("unhandledrejection", (ev) => {
  const r = ev.reason;
  psErr("reject", (r && (r.stack || r.message)) ? (r.stack || r.message) : String(r));
});

 * 用 `typeof` 而不是直接读：读一个**未声明**的标识符会抛 ReferenceError，
 * 而 `typeof` 对未声明的标识符返回 "undefined"、**不抛**。
 * 于是这一句能安全地回答："这些名字在当前作用域里到底在不在？"
 *
 * 为什么需要它：本文件的模块级函数与 `init()` 内部函数**混在一起**，
 * 缩进又不作数（全都顶格写）。光靠读代码极易误判谁在谁的里面 ——
 * 而"模块级函数引用了 init() 内的变量"会抛出 ReferenceError，
 * 且只在**那条路径**上才炸，很难发现。 */
function psScopeProbe(){
  const names = ["gpuReady", "gpuRenderer", "gpuRaf", "gpuBusy", "gpuInfo", "gpuReason",
                 "backendPref", "backendActive", "gpuSyncCanvas", "gpuEnsureScene",
                 "gpuPreviewStats", "gpuInitPromise", "initBackend", "gpuBtn",
                 "gpuPlay", "gpuScheduleAssets", "gpuStatsFromPack", "gpuLoopSelfCheck",
                 "updateReadoutGpu", "runGpuSelfTest", "_initBackendOnce",
                 "sceneKeyNow", "assetsKeyNow",
                 "renderPreview", "applyZoom", "stopPlay", "play",
                 "logicalSize", "P", "busy", "renderPending"];
  const probe = {};
  for (const n of names){
    try { probe[n] = eval("typeof " + n); } catch (e) { probe[n] = "THROW:" + e.message; }
  }
  PAGE_STATE.scope = probe;
  psFlush();
}

 *    加上「已等 Ns」之后，"在等一个慢东西"和"卡死了"是两种完全不同的体验。 */
function busyBadgeTimed(msg){
  busyBadge(msg);
  const b = $("badge");
  const t0 = Date.now();
  _badgeTimer = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    if (sec > 0) b.textContent = msg.replace(/…\s*$/, "") + " · 已等 " + sec + " 秒…";
  }, 1000);
}
function hsl2hex(v){ return "#" + v.map(x => Math.round(Math.max(0, Math.min(1, x)) * 255).toString(16).padStart(2, "0")).join(""); }
function hex2rgb(h){
  h = h.replace("#", "");
  return [0,2,4].map(i => parseInt(h.slice(i, i+2), 16) / 255);
}
function qs(extra){
  const o = Object.assign({}, P, extra || {});
  const parts = [];
  for (const k of Object.keys(o)){
    let v = o[k];
    if (typeof v === "boolean") v = v ? 1 : 0;
    if (typeof v === "number") v = Number(v.toFixed(6));
    parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
  }
  parts.push("asset=" + encodeURIComponent($("asset").value));
  return parts.join("&");
}

        w.innerHTML = `<div class="lab"><span>${tr(r.t)}</span></div>`;
        const sel = document.createElement("select");
        sel.className = "mini";
        for (const [v, lab] of r.opts){
          const o = document.createElement("option");
          o.value = v; o.textContent = tr(lab);
          sel.appendChild(o);
        }
        sel.value = String(P[r.k]);
        sel.onchange = () => { P[r.k] = sel.value; onParamChange(r, true, r.k); };
        w.appendChild(sel);
        if (r.hint) w.insertAdjacentHTML("beforeend", `<div class="hint">${trHint(r.k, r.hint)}</div>`);
        body.appendChild(w);
      }
      else if (r.type === "color"){
        const w = document.createElement("div");
        w.className = "row";
        const [cr, cg, cb] = r._c;
        w.innerHTML = `<div class="lab"><span>${tr(r.t)}</span>
            <label class="sw" style="padding:0"><input type="checkbox" ${r.auto(P) ? "checked" : ""}><i></i>
            <span style="font-size:10.5px">${tr("自动")}</span></label></div>`;
        const cb2 = document.createElement("label");
        cb2.className = "colorrow" + (r.auto(P) ? " auto" : "");
        const inp = document.createElement("input");
        inp.type = "color";
        inp.value = hsl2hex([P[cr] < 0 ? .5 : P[cr], P[cg] < 0 ? .5 : P[cg], P[cb] < 0 ? .5 : P[cb]]);
        const hx = document.createElement("span");
        hx.className = "chex";
        hx.textContent = r.auto(P) ? tr("自动估计") : inp.value;
        inp.oninput = () => {
          const rgb = hex2rgb(inp.value);
          P[cr] = rgb[0]; P[cg] = rgb[1]; P[cb] = rgb[2];
          hx.textContent = inp.value;
          onParamChange(r, false, cr);        // 传真实字段名（fog_r / rays_r）
        };
        inp.onchange = () => onParamChange(r, true, cr);
        cb2.appendChild(inp); cb2.appendChild(hx);
        const sw = w.querySelector("input[type=checkbox]");
        sw.onchange = () => {
          const on = sw.checked;
          if (on){ P[cr] = P[cg] = P[cb] = -1; }
          else { const rgb = hex2rgb(inp.value); P[cr] = rgb[0]; P[cg] = rgb[1]; P[cb] = rgb[2]; }
          hx.textContent = on ? "自动估计" : inp.value;
          cb2.classList.toggle("auto", on);
          onParamChange(r, true, cr);
        };
        w.appendChild(cb2);
        if (r.hint) w.insertAdjacentHTML("beforeend", `<div class="hint">${trHint(r.k, r.hint)}</div>`);
        body.appendChild(w);
      }
      else if (r.type === "vec2"){
        const w = document.createElement("div");
        w.className = "row";
        const [cx, cy] = r._c;
        w.innerHTML = `<div class="lab"><span>${tr(r.t)}</span>
            <label class="sw" style="padding:0"><input type="checkbox" ${r.auto(P) ? "checked" : ""}><i></i>
            <span style="font-size:10.5px">${tr("自动")}</span></label></div>`;
        const wrap = document.createElement("div");
        wrap.className = "grid2";
        for (const [key, lab] of [[cx, "X"], [cy, "Y"]]){
          const cell = document.createElement("div");
          cell.innerHTML = `<div class="lab"><span style="font-size:11px">${lab}</span>
              <span class="val">${fmt(P[key])}</span></div>`;
          const inp = document.createElement("input");
          inp.type = "range"; inp.min = 0; inp.max = 1; inp.step = .005; inp.value = P[key];
          // ⚠️ 把**真实字段名**（rays_x / rays_y）传出去。
          //    这个控件包了两个字段，row.k 是占位名 "_light" ——
          //    下游若拿 row.k 去比对 "rays_x" 就永远不匹配（标记不动的根因）。
          inp.oninput = () => {
            P[key] = +inp.value;
            cell.querySelector(".val").textContent = fmt(P[key]);
            // 光源标记必须**立刻**跟随，不等渲染回来
            if (key === cx || key === cy) updateMarker();
            onParamChange(r, false, key);
          };
          inp.onchange = () => onParamChange(r, true, key);
          cell.appendChild(inp);
          wrap.appendChild(cell);
        }
        w.appendChild(wrap);
        const sw = w.querySelector("input[type=checkbox]");
        sw.onchange = () => { P[r._auto] = sw.checked; wrap.style.opacity = sw.checked ? .4 : 1;
                              wrap.style.pointerEvents = sw.checked ? "none" : "auto";
                              onParamChange(r, true, r._auto); };
        wrap.style.opacity = r.auto(P) ? .4 : 1;
        wrap.style.pointerEvents = r.auto(P) ? "none" : "auto";
        if (r.hint) w.insertAdjacentHTML("beforeend", `<div class="hint">${trHint(r.k, r.hint)}</div>`);
        body.appendChild(w);
      }
      else if (r.type === "bool"){
        const w = document.createElement("div");
        w.className = "row";
        w.innerHTML = `<div class="lab"><span>${tr(r.t)}</span></div>`;
        const sw = document.createElement("label");
        sw.className = "sw";
        sw.innerHTML = `<input type="checkbox" ${P[r.k] ? "checked" : ""}><i></i>`;
        sw.querySelector("input").onchange = (e) => {
          P[r.k] = e.target.checked;
          onParamChange(r, true, r.k);
        };
        w.appendChild(sw);
        if (r.hint) w.insertAdjacentHTML("beforeend", `<div class="hint">${trHint(r.k, r.hint)}</div>`);
        body.appendChild(w);
      }
      else {
        const w = document.createElement("div");
        w.className = "row";
        w.innerHTML = `<div class="lab"><span>${tr(r.t)}</span><span class="val">${fmt(P[r.k])}</span></div>`;
        const inp = document.createElement("input");
        inp.type = "range";
        inp.min = r.min; inp.max = r.max; inp.step = r.step; inp.value = P[r.k];
        const val = w.querySelector(".val");
        inp.oninput = () => { P[r.k] = +inp.value; val.textContent = fmt(P[r.k]); onParamChange(r, false, r.k); };
        inp.onchange = () => onParamChange(r, true, r.k);
        w.appendChild(inp);
        const cls = (r.hint && (r.hint.includes("⚠️") || r.hint.includes("区间很窄"))) ? "hint warn" : "hint";
        if (r.hint) w.insertAdjacentHTML("beforeend", `<div class="${cls}">${trHint(r.k, r.hint)}</div>`);
        body.appendChild(w);
      }
    }
    d.appendChild(body);
    rail.appendChild(d);
  }
}

/* ── 参数变化：拖动**和松手都只渲首帧**；整段由「渲染预览」/「播放」显式触发 ──

   ⚠️ 这里的节流是"必跑的、只保留最新值"，不是"限流后丢弃"。

   第一版写成 `if (stillTimer) return;` —— 意思是"上一次还没跑完就丢弃新事件"。
   后果：连续拖动时，事件被成片地丢掉，而且**松手前最后那一次也可能被丢**，
   于是画面停在某个中间值上，用户以为滑杆坏了。
   实测拖动刷新率只有约 8~15 fps（渲染 45ms + 往返 67ms 是硬成本）。

   正确做法：用一个 `pending` 标记。
   - 正在渲染 → 只把最新值记下来，不排队
   - 渲染结束 → 若期间有更新，立刻用**最新值**再渲一次
   这样无论如何，**最终显示的一定是松手时的值**。

   ⭐ 另外（用户建议，实测支持）：**松手也只重渲首帧，不渲整段。**
   整段 60 帧要 6.3 秒（服务端渲 60 帧算统计 3.2s + 逐帧取图 3.1s），
   而调参时人只关心"改了这个参数画面变成什么样" —— 首帧足够。
   整段只在**点播放**时才渲，那代价才值得。
   实测单帧往返 40~70ms，比整段快约 100 倍。 */
let stillBusy = false, stillPending = false, stillAbort = 0;

function onParamChange(row, released, changedKey){
  // 实际变化的字段：vec2/color 这类复合控件的 row.k 是占位名（如 "_light"），
  // 真正的字段要由子控件传进来 —— 之前这里拿 row.k 去比对 "rays_x"，
  // **永远不匹配**，于是拖 XY 时标记不动（用户报障）。
  const key = changedKey || row.k;
  invalidateFrames();
  scheduleDebug();
  // GPU 后端：色板/核/粒子参数变了 → debounce 后向服务端要一次新素材；
  // 同时立刻重渲单帧（不等素材回来，用旧色板先看着）
  if (backendActive()){
    if (SCENE_KEYS.includes(key)) gpuSceneKey = "";
    gpuScheduleAssets();
    scheduleGpuStill();
  }
  if (SCENE_KEYS.includes(key)){ sceneStale = true; sceneStaleMark(); }
  // 光源位置变化时标记要**立刻**跟着动（不等渲染回来，否则就是"跳变"）
  if (key === "rays_x" || key === "rays_y" || key === "rays_auto_center") updateMarker();
  if (key === "light2_x" || key === "light2_y" || key === "light2_on") updateMarker2();
  // 改了网格/预处理 → 逻辑尺寸会变，先问一次好把取景框尺寸定准
  if (SCENE_KEYS.includes(key) && released) refreshMeta();
  // ⭐ 视差推拉在 t=0 处位移**恰好为零**（循环闭合的要求）——
  //    预览默认停在 t=0，所以"拖完滑杆看首帧"必然看不出任何变化
  //    （用户实测反馈："我肉眼看不出来"）。
  //    打开视差时自动跳到 1/4 周期（位移接近峰值），并说明原因。
  if (key === "parallax" && released){
    const amp = parseFloat(P.parallax) || 0;
    if (amp > 0 && cur === 0 && frameCount > 4){
      cur = Math.round(frameCount * 0.25);
      $("scrub").value = cur;
      $("scrubT").textContent = "t = 0.25";
      toast("视差在 t=0 位移为零（循环闭合要求）—— 已跳到 1/4 周期；点播放看完整推拉", "ok");
    }
  }
  if (released){
    // ⭐ 松手也**只渲首帧** —— 整段留给「渲染预览」/「播放」（见上面注释）
    if (frames.length) renderStillOnly();
    else renderPreview();
  } else {
    scheduleStill();
  }
}
function scheduleStill(){
  if (stillBusy){ stillPending = true; return; }   // 记住"有新值"，不丢弃
  stillBusy = true;
  const mine = ++stillAbort;
  requestAnimationFrame(async () => {
    try { await renderStillOnly(); } finally { stillBusy = false; }
    if (stillPending){ stillPending = false; scheduleStill(); }
  });
}
/* 参数一变，已渲好的整段帧就不再对应当前参数 —— 必须显式失效。 */
/* GPU 模式下拖动滑杆：立刻重渲一帧（本地渲染，没有往返，不需要节流） */
let gpuStillTimer = 0;
function scheduleGpuStill(){
  clearTimeout(gpuStillTimer);
  gpuStillTimer = setTimeout(() => {
    if (!gpuCanRender() || !gpuRenderer || !gpuRenderer.scene) return;
    gpuRenderer.render(P, cur / Math.max(1, frameCount || 1));
    updateMarker();
  }, 16);
}
/* frames 失效但不改按钮文案 —— GPU 模式下本来就不靠 frames */
function invalidateFrames0(){
  framesValid = false;
}

function invalidateFrames(){
  // ⚠️ GPU 后端**没有"整段"可失效** —— 每一帧都是按需现渲的，
  //    改参数只影响之后的帧。如果把 framesValid 打成 false：
  //    · 按钮变成「播放 ⟳」（暗示要重渲整段 —— GPU 模式这是谎言）
  //    · play() 开头 `if (!framesValid) return` → **点播放静默不响**
  //      （用户实测：改完参数播放就坏了，按钮还带个圆圈箭头）
  if (gpuCanRender()) return;
  if (!framesValid) return;
  framesValid = false;
  $("btnPlay").textContent = "播放 ⟳";       // ⟳ = 需要重渲整段
  $("btnPlay").title = "参数已改，点播放会先重渲整段";
}
function sceneStaleMark(){
  const b = $("badge");
  b.textContent = "场景已变更 · 松手后重建";
  b.classList.add("on", "busy");
}

async function renderStillOnly(iArg){
  const i = (iArg === undefined) ? cur : iArg;
  // ⭐ GPU 后端：直接在浏览器里渲这一帧，**没有任何网络往返**。
  //    这正是移植的收益所在（服务端路径要 渲染 + PNG 编码 + HTTP ≈ 67ms）。
  if (gpuCanRender()){
    try{
      await gpuEnsureScene(false);
      const tt = i / Math.max(1, frameCount || 1);
      gpuRenderer.render(P, tt);
      gpuSyncCanvas();
      $("plate").textContent = `${tr("帧")} ${i} / ${Math.max(0, frameCount - 1)}`;
      $("scrubT").textContent = "t = " + tt.toFixed(2);
      updateMarker();
      return;
    } catch (e){
      // 出问题就退回服务端，不要让画面停住
      console.warn("[webgpu] 单帧失败，回退：", e);
      gpuReady = false; gpuRenderer = null;
      $("stagebox").classList.remove("gpu");
      gpuBtn("bad", "后端：服务端", "WebGPU 失败已回退：" + e.message);
    }
  }
  // ⚠️ 用**当前 zoom 档**而不是"拖动时减半"。
  //    减半的图在固定尺寸的框里不会被放大，只会显得更糊 ——
  //    而且它正是"画面尺寸跳变"的根因。渲染本身只要 ~50ms，省它没有意义。
  const url = "/api/still?" + qs({ t: (i / Math.max(1, frameCount || 1)).toFixed(4), scale: zoom });
  await swapFrame(url);
}
function swapFrame(url){
  return new Promise((res) => {
    const el = $("frame");
    if (imgCache.has(url)){ el.src = url; updateMarker(); return res(); }
    const tmp = new Image();
    tmp.onload = () => { imgCache.set(url, 1); el.src = url; updateMarker(); res(); };
    tmp.onerror = () => res();
    tmp.src = url;
  });
}

/* ⭐ 记录**当前**的收尾状态。
 * ⚠️ 必须在**每个会改变这些状态的时点**都调一次：
 *    renderDone（首帧收尾）之外，后台整段就绪/失败时也要再记 ——
 *    否则体检读到的是首帧时刻的旧快照（「播放」那时**应该**是禁用的），
 *    于是得到一个**稳定复现的假问题**（实测就是这么报出来的）。
 *    另外首帧那次 psPaintCheck 是渲染进行中拍的快照，那时按钮本来就
 *    该禁用 —— 拿它断言"按钮不该禁用"必然出错。 */
function recordFinal(){
  PAGE_STATE.final = {
    backend: backendName(), busy: busy,
    preview_disabled: $("btnPreview").disabled,
    play_disabled: $("btnPlay").disabled,
    badge_on: $("badge").classList.contains("on"),
    frames_valid: framesValid, n_frames: frameCount
  };
  psFlush();
}

/* 渲染收尾 —— **唯一的** busy 复位点。
 * 若期间有人叫过渲染（`renderPending`），立刻补跑一次。 */
function renderDone(){
  busy = false;
  $("btnPreview").disabled = false;
  recordFinal();
  if (renderPending){
    renderPending = false;
    ps("renderPreview:补跑待办");
    renderPreview();
  } else {
    ps("renderPreview:done", { backend: backendName() });
  }
}

/* ⭐ 首帧"真的有内容吗" —— 直接把打包缓冲读回来算统计，并记下画布的可见性。
 *
 * ⚠️ 这条是必需的：这一轮所有 bug 的**共同症状都是"全黑"**，而"全黑"从界面上
 *    分不出是"渲染了一帧黑"还是"压根没渲染"。只有把像素读回来才能分辨。
 *    （另外记录可见性：曾经出过"渲染对了但显示的是另一个元素"。）
 */
async function psPaintCheck(tag){
  const info = { tag };
  try{
    const c = $("gpuCanvas"), box = $("stagebox");
    const cs = getComputedStyle(c);
    info.canvas_buf = [c.width, c.height];
    info.canvas_css = [cs.width, cs.height];
    info.canvas_display = cs.display;
    info.img_display = getComputedStyle($("frame")).display;
    info.stagebox_gpu = box.classList.contains("gpu");
    info.btns = { preview: $("btnPreview").disabled, play: $("btnPlay").disabled };
    info.badge = ($("badge").className || "") + "|" + ($("badge").textContent || "").slice(0, 40);
    info.busy = busy;

    const r = gpuRenderer;
    if (!r || !r.scene){ info.err = "没有场景"; PAGE_STATE.canvas = info; psFlush(); return; }
    if (r.canvas.width !== r.scene.W) info.warn_resize = "画布后备缓冲与网格不一致";
    const bytes = r.scene.npix * 4;
    const rb = r.dev.createBuffer({ size: bytes,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = r.dev.createCommandEncoder();
    enc.copyBufferToBuffer(r.buf.packed, 0, rb, 0, bytes);
    r.dev.queue.submit([enc.finish()]);
    await r.dev.queue.onSubmittedWorkDone();
    await rb.mapAsync(GPUMapMode.READ);
    const a = new Uint32Array(rb.getMappedRange().slice(0));
    rb.unmap(); rb.destroy();
    let mn = 255, mx = 0, sum = 0, dark = 0;
    for (let i = 0; i < a.length; i++){
      const px = a[i];
      if ((px & 0xFFFFFF) === 0) dark++;               // 打包低位是 R，全 0 就是黑
      const v = ((px & 0xFF) + ((px >> 8) & 0xFF) + ((px >> 16) & 0xFF)) / 3;
      if (v < mn) mn = v; if (v > mx) mx = v; sum += v;
    }
    info.px = a.length;
    info.dark_pct = +(100 * dark / a.length).toFixed(2);
    info.min = +mn.toFixed(1); info.max = +mx.toFixed(1);
    info.mean = +(sum / a.length).toFixed(2);
    // 唯一色数：像素画的"全黑"是不是真的只有一种颜色，这一条最能说明问题
    info.uniq = new Set(Array.from(a.slice(0, Math.min(a.length, 40000)))).size;
  } catch (e){
    info.err = (e && e.message) || String(e);
  }
  PAGE_STATE.canvas = info;
  psFlush();
}

/* 服务端路径的"真的画出来了吗" —— 把 `<img>` 画进离屏 canvas 采样。
 *
 * ⚠️ GPU 路径能直接读回缓冲，服务端路径只有一个 `<img>` 的 URL。
 *    但"用户看到的是不是黑的"这个问题对**两条路都要能回答** ——
 *    否则回退路径出问题（没有 WebGPU 的用户）我们一样只能靠截图猜。
 *    同源图片可以 drawImage + getImageData，正好够用。
 */
async function psPaintCheckImg(tag){
  const info = { tag, backend: backendName() };
  try{
    const im = $("frame");
    info.img_src = (im.getAttribute("src") || "").slice(-48);
    info.img_complete = im.complete;
    info.img_natural = [im.naturalWidth, im.naturalHeight];
    info.img_display = getComputedStyle(im).display;
    info.img_css = [getComputedStyle(im).width, getComputedStyle(im).height];
    info.canvas_display = getComputedStyle($("gpuCanvas")).display;
    info.busy = busy;
    info.badge = ($("badge").className || "") + "|" + ($("badge").textContent || "").slice(0, 40);
    if (!im.complete || !im.naturalWidth){ info.err = "图片没加载完"; }
    else {
      const c = document.createElement("canvas");
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      let mn = 255, mx = 0, sum = 0, dark = 0;
      const uniq = new Set();
      const stride = Math.max(1, Math.floor((d.length / 4) / 20000));
      let cnt = 0;
      for (let i = 0; i < d.length; i += 4 * stride){
        const v = (d[i] + d[i+1] + d[i+2]) / 3;
        if (v < mn) mn = v; if (v > mx) mx = v; sum += v;
        if (d[i] === 0 && d[i+1] === 0 && d[i+2] === 0) dark++;
        uniq.add((d[i] << 16) | (d[i+1] << 8) | d[i+2]);
        cnt++;
      }
      info.px = cnt;
      info.dark_pct = +(100 * dark / cnt).toFixed(2);
      info.min = +mn.toFixed(1); info.max = +mx.toFixed(1);
      info.mean = +(sum / cnt).toFixed(2);
      info.uniq = uniq.size;
    }
  } catch (e){
    info.err = (e && e.message) || String(e);
  }
  PAGE_STATE.canvas = info;
  psFlush();
}

/* ══════════════════════════════════════════════════════════════════
 * 交互探针（`?probe=ui`）
 *
 * 为什么需要：启动体检只证明「首帧能出来」；用户实际抱怨的是
 * **交互**（播放不动、滑杆没反应、切图卡住、标记消失）。
 * 这些只有真的去做一遍才知道 —— 所以这个探针把用户会做的每个交互
 * **程序化地做一遍**，判据全部用**读回像素**（画面到底变没变），
 * 不用"看起来对"。
 *
 * 结果 POST 回服务端（固定名 `_ui_probe`），tools/browser_ui_probe.py
 * 无人值守地驱动并断言。
 * ══════════════════════════════════════════════════════════════════ */
/* 当前帧的原始像素（GPU=packed 缓冲，服务端=解码 img）。供探针算逐像素差异。 */
async function probeFramePixels(){
  if (backendActive()){
    const r = gpuRenderer;
    const bytes = r.scene.npix * 4;
    const rb = r.dev.createBuffer({ size: bytes,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = r.dev.createCommandEncoder();
    enc.copyBufferToBuffer(r.buf.packed, 0, rb, 0, bytes);
    r.dev.queue.submit([enc.finish()]);
    await r.dev.queue.onSubmittedWorkDone();
    await rb.mapAsync(GPUMapMode.READ);
    const a = new Uint32Array(rb.getMappedRange().slice(0));
    rb.unmap(); rb.destroy();
    return a;
  }
  const im = $("frame");
  const c = document.createElement("canvas");
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(im, 0, 0);
  return new Uint32Array(g.getImageData(0, 0, c.width, c.height).data.buffer);
}

/* 两帧的逐像素差异统计（max 通道差）。 */
function pixelDiffStats(a, b){
  const n = Math.min(a.length, b.length);
  let mx = 0, cnt = 0;
  for (let i = 0; i < n; i++){
    const pa = a[i], pb = b[i];
    const d = Math.max(Math.abs((pa & 255) - (pb & 255)),
                       Math.abs(((pa >> 8) & 255) - ((pb >> 8) & 255)),
                       Math.abs(((pa >> 16) & 255) - ((pb >> 16) & 255)));
    if (d > mx) mx = d;
    if (d > 8) cnt++;
  }
  return { max: mx, strong_pct: +(100 * cnt / n).toFixed(2) };
}

async function probeSig(){
  /* 当前画面的签名（和 + 非零像素数）。两条后端各有一条读法。 */
  if (backendActive()){
    const r = gpuRenderer;
    if (!r || !r.scene) return { err: "no scene" };
    const bytes = r.scene.npix * 4;
    const rb = r.dev.createBuffer({ size: bytes,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = r.dev.createCommandEncoder();
    enc.copyBufferToBuffer(r.buf.packed, 0, rb, 0, bytes);
    r.dev.queue.submit([enc.finish()]);
    await r.dev.queue.onSubmittedWorkDone();
    await rb.mapAsync(GPUMapMode.READ);
    const a = new Uint32Array(rb.getMappedRange().slice(0));
    rb.unmap(); rb.destroy();
    let sum = 0, nz = 0;
    for (let i = 0; i < a.length; i++){
      const px = a[i] & 0xFFFFFF;
      sum = (sum + (px & 0xFF) + ((px >> 8) & 0xFF) + ((px >> 16) & 0xFF)) >>> 0;
      if (px) nz++;
    }
    return { sum: sum, nz: nz };
  }
  const im = $("frame");
  if (!im.complete || !im.naturalWidth) return { err: "img not ready" };
  const c = document.createElement("canvas");
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let sum = 0, nz = 0;
  for (let i = 0; i < d.length; i += 16){
    sum = (sum + d[i] + d[i+1] + d[i+2]) >>> 0;
    if (d[i] || d[i+1] || d[i+2]) nz++;
  }
  return { sum: sum, nz: nz };
}

async function runUiProbe(){
  // ⚠️ rep 带 run token：驱动靠它认"这份报告是这一轮的"。
  //    第一版没带，而 step() 在第一步就把半成品 rep 挂到了 PAGE_STATE 上，
  //    驱动看到 uiProbe 非空就收工 —— 每次都只跑到第四步，白跑两轮。
  const rep = { ok: false, steps: [], ts: Date.now(), run: PAGE_STATE.run };
  const step = (name, d) => {
    rep.steps.push(Object.assign({ name: name }, d || {}));
    PAGE_STATE.uiProbe = rep; psFlush();
  };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  try {
    rep.backend = backendName();
    step("开始", { backend: rep.backend, framesValid: framesValid, frameCount: frameCount });

    const s0 = await probeSig();
    step("初帧签名", s0);

    /* ① 播放：走**按钮的完整处理**（含"整段过期先补渲"），采样两次看画面动不动 */
    await onPlayClick();
    await sleep(900);
    const p1 = await probeSig();
    await sleep(700);
    const p2 = await probeSig();
    step("播放", { moving: (p2.sum !== p1.sum),
                   btn: $("btnPlay").textContent, playing: playing,
                   err: p1.err || p2.err });
    stopPlay();
    await sleep(200);

    /* ② 进度条：拖到 1/3 处，画面必须变 */
    cur = Math.max(1, Math.floor(frameCount / 3));
    await renderStillOnly(cur);
    await sleep(200);
    const s1 = await probeSig();
    step("进度条", { changed: (s1.sum !== s0.sum) });

    /* ③ 逐个滑杆：改一步 → 画面必须变。
     *    SCENE_KEYS 要重建场景（秒级），只测 grid_long 一个代表；
     *    其余每个都测。 */
    const tried = [];
    for (const grp of SPEC) for (const r of grp.rows){
      const keys = r._c || [r.k];
      const k = keys[0];
      if (tried.indexOf(k) >= 0) continue;
      if (typeof P[k] === "number" && !r.step) continue;
      if (r.type === "select") continue;
      if (SCENE_KEYS.includes(k) && k !== "grid_long") continue;
      tried.push(k);
      if (!(k in P)) { step("滑杆 " + k, { err: "P 里没有" }); continue; }
      const v0 = P[k];
      let nv;
      if (typeof v0 === "number") nv = Math.min((r.max != null ? r.max : 99), v0 + (r.step || 0.1));
      else if (typeof v0 === "boolean") nv = !v0;
      else continue;
      const sceneKey = SCENE_KEYS.includes(k);
      P[k] = nv;
      onParamChange(r, true, k);
      await sleep(sceneKey ? 9000 : 500);
      const sg = await probeSig();
      step("滑杆 " + k, { changed: (sg.sum !== s0.sum || sg.sum !== sg.nz * 1e9) && sg.sum !== undefined ? sg.sum !== s0.sum : null,
                           scene: sceneKey, err: sg.err });
      P[k] = v0;
      onParamChange(r, true, k);
      await sleep(sceneKey ? 9000 : 350);
    }

    /* ③b 改参后点播放（用户报的 bug：改完参数播放静默不响，按钮带 ⟳）
     *    上面的滑杆循环已经把参数改了一圈又复原 —— 正是出 bug 的状态。 */
    await onPlayClick();
    await sleep(900);
    const q1 = await probeSig();
    await sleep(700);
    const q2 = await probeSig();
    step("播放(改参后)", { moving: (q2.sum !== q1.sum),
                           btn: $("btnPlay").textContent,
                           err: q1.err || q2.err });
    stopPlay();
    await sleep(200);

    /* ③c 循环闭合读数（用户报的 bug：拖完滑杆永远卡在「检测中…」）
     *    素材类滑杆会触发 gpuScheduleAssets —— 旧版本在那里把 loop_ok
     *    抹回 null 且不再自检。churn 之后读 verdict，必须有结论。 */
    for (let i = 0; i < 20 && gpuSelfCheckBusy; i++) await sleep(250);
    step("循环闭合读数", {
      loop_ok: gpuPreviewStats ? gpuPreviewStats.loop_ok : "无统计",
      loop_err: gpuPreviewStats ? (gpuPreviewStats.loop_err || null) : null
    });

    /* ③d 视差在 GPU 上必须真的生效（M5 移植验收）——
     *    ⚠️ 判据两点：画面必须变（视差本身有效），且**仍然是 GPU 后端**
     *    （没有悄悄回退到服务端 —— 那正是移植前的行为）。 */
    {
      const before = await probeSig();
      P.parallax = 0.5;
      onParamChange({ k: "parallax" }, true, "parallax");
      await sleep(900);
      const after = await probeSig();
      step("视差(GPU)", {
        changed: after.sum !== before.sum,
        backend: backendName(),
        same_as_server_fallback: false
      });
      P.parallax = 0;
      onParamChange({ k: "parallax" }, true, "parallax");
      await sleep(400);
    }

    /* ③e 光锥 + 光柱（M5.1/M5.2）：逐像素量化三态
     *    关 → 开锥 → 开锥+光柱。
     *    ⚠️ 判据必须**分级**：只开锥（塑形）本身很弱是实测结论（体积光层
     *    只有 1~3/255），所以只要求"有变化"；**光柱**才是要求
     *    "锥内强变化"的那一档。 */
    {
      const s0 = await probeFramePixels();
      P.rays_cone = 0.75; P.rays_dir = 30;
      onParamChange({ k: "rays_cone" }, true, "rays_cone");
      await sleep(900);
      const f1 = await probeFramePixels();
      P.rays_shaft = 1.9;
      onParamChange({ k: "rays_shaft" }, true, "rays_shaft");
      await sleep(900);
      const f2 = await probeFramePixels();

      const d1 = pixelDiffStats(s0, f1);
      const d2 = pixelDiffStats(f1, f2);
      step("光锥+光柱", {
        backend: backendName(), build: gpuBuild,
        开锥: d1, 开光柱后: d2,
        shaft: P.rays_shaft
      });
      P.rays_cone = 0; P.rays_dir = 80; P.rays_shaft = 0;
      onParamChange({ k: "rays_cone" }, true, "rays_cone");
      await sleep(400);
    }

    /* ④ 光源标记：勾上后标记必须可见、且落在取景框内 */
    $("showMarker").checked = true;
    updateMarker();
    await sleep(120);
    const mk = $("marker"), box = $("stagebox");
    step("光源标记", {
      visible: mk.classList.contains("on") && getComputedStyle(mk).display !== "none",
      left: mk.style.left, top: mk.style.top,
      boxW: box.offsetWidth, boxH: box.offsetHeight
    });
    $("showMarker").checked = false;
    updateMarker();

    /* ⑤ 切换素材：下一张，量"从发起到画面变化"的耗时 */
    const sel = $("asset");
    const idx = sel.selectedIndex;
    const next = sel.options[(idx + 1) % sel.options.length].value;
    const t0 = performance.now();
    sel.value = next;
    syncPicker(); sceneStale = true; refreshMeta(); renderPreview();
    let switched = null;
    for (let i = 0; i < 240; i++){
      await sleep(500);
      if (busy) continue;
      const sg = await probeSig();
      if (sg.sum !== undefined && sg.sum !== s0.sum){ switched = performance.now() - t0; break; }
    }
    step("切换素材", { to: next, ms: switched === null ? null : Math.round(switched) });

    rep.ok = true;
  } catch (e){
    rep.err = (e && e.stack) || String(e);
  }
  PAGE_STATE.uiProbe = rep;
  document.title = "UIPROBE:" + (rep.ok ? "OK" : "FAIL");
  // ⚠️ 必须**直接 await POST**，不能靠 psFlush 的防抖 ——
  //    驱动脚本看到 uiProbe 就会在 2 秒后关浏览器，防抖的 150ms
  //    大多数时候赶不上，报告就丢了（实测丢过一次，白跑一轮）。
  try{
    await fetch("/api/params", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: "_ui_probe", params: rep })
    });
  } catch (e2){ /* 服务端拿不到就算了 */ }
  return rep;
}

/* ── 整段预览 ── */
async function renderPreview(){
  if (busy){
    // ⚠️⚠️ **不能把后来者直接丢掉。**
    //
    //    原来这里是 `if (busy) return;` —— 于是任何在"渲染进行中"发起的请求
    //    都被静默吞掉，调用方以为会渲、实际什么都没发生。
    //    实测的用户可⻅症状：**打开页面后画面一直是黑的** ——
    //    启动流程里 `init()` 早在 GPU 初始化之前就调了一次 renderPreview
    //    （走服务端路径、耗时几十秒、占住 busy），
    //    而后端初始化完成后那次 renderPreview 被这里吞掉 →
    //    **GPU 画布永远没被画过一帧**，而界面已经切到 GPU 模式（显示画布）→ 全黑。
    //
    //    正确做法：记一个待办，当前这次收尾时补跑一次（合并成一次，不并发）。
    renderPending = true;
    ps("renderPreview:busy 中，已记待办");
    return;
  }
  busy = true;
  renderPending = false;
  ps("renderPreview:enter", { backend: backendName(), stale: sceneStale });
  $("btnPreview").disabled = true;
  stopPlay();
  // ⭐ GPU 后端：不需要"渲整段 + 逐帧取图"，只有一次场景包传输。
  if (gpuCanRender()){
    busyBadgeTimed("准备场景（首次要跑深度推理，可能要几十秒）…");
    try{
      await gpuEnsureScene(sceneStale);
      sceneStale = false;
      frameCount = Math.max(2, Math.round((+P.seconds || 6) * (+P.fps || 30)));
      previewFps = +P.fps || 30;
      invalidateFrames0();
      framesValid = true;
      $("scrub").max = Math.max(0, frameCount - 1);
      cur = 0; $("scrub").value = 0;
      gpuRenderer.render(P, 0);
      gpuSyncCanvas();
      await psPaintCheck("首帧");
      $("badge").classList.remove("on");
      $("btnPlay").disabled = false;
      $("btnPlay").textContent = tr("播放");
      $("btnPlay").title = "";
      toast(`WebGPU 就绪 · 每帧在浏览器内渲染（${gpuInfo}）`, "ok");
      busyBadge("");
    } catch (e){
      psErr("gpu-path", (e && e.stack) || e);
      toast("WebGPU 准备失败，已切回服务端：" + e.message, "bad");
      gpuReady = false; gpuRenderer = null;
      renderPending = false;               // 回退就是重新渲一遍，别让待办叠一层
      $("stagebox").classList.remove("gpu");
      gpuBtn("bad", "后端：服务端", "WebGPU 失败已回退：" + e.message);
      busy = false;
      $("btnPreview").disabled = false;
      return renderPreview();
    } finally {
      // ⚠️ 注意：catch 里已经手工复位并 return，走的是上面那条路；
      //    正常完成时由这里收尾（并补跑待办）。
      if (busy) renderDone();
    }
    return;
  }
  // ⭐⭐ **首帧优先**：先渲**一帧**让用户看到画面，整段在后台补。
  //
  //    以前的顺序是「渲完整段 60 帧 → 才显示第一帧」。实测耗时：
  //    全新素材 = 深度 0.26s + 场景/色板 ~7s + 整段 60 帧 ~5s ≈ **14s 黑屏**；
  //    热缓存也要 ~5s。用户看到的就是「切个图卡死半分钟」。
  //    现在 2~8s 就有图可看、可调；「播放」在整段后台就绪后自动亮起。
  //
  //    ⚠️ 深度推理本身只要 0.26s（量过），**不值得上 GPU** —— 慢的是
  //    场景重建与整段渲染的**编排**，这正是这里改的东西。
  busyBadgeTimed(sceneStale ? "重建场景中（首次含深度与场景，可能要几十秒）…" : "出首帧…");
  try{
    const stillUrl = "/api/still?" + qs({ t: 0, scale: zoom });
    await swapFrame(stillUrl);
    await psPaintCheckImg("首帧");
    if (zoomAuto) zoom = fitZoom();
    applyZoom();
    sceneStale = false;
    busyBadge("");
    framesValid = false;                       // 整段还没好
    frames = [];
    $("btnPlay").disabled = true;
    $("btnPlay").textContent = "整段后台准备中…";
    $("btnPlay").title = "整段在后台渲染，好了会自动可点";
    fillPreviewInBackground();
  } catch (e){
    psErr("server-path", (e && e.stack) || e);
    toast("预览失败：" + e.message, "bad");
    busyBadge("");
  } finally {
    renderDone();
  }
}

/* 后台补整段。独立序号：参数又变了的话，这批回来直接作废。 */
let previewBgSeq = 0;
async function fillPreviewInBackground(){
  const mine = ++previewBgSeq;
  try{
    const fps = 10;
    // ⚠️ 必须把 scale 一起传：服务端按这个 scale **预编码**帧塞进缓存，
    //    界面随后也按同样的 scale 取帧才能命中。
    const r = await fetch("/api/preview?" + qs({ preview_fps: fps, scale: zoom }));
    const st = await r.json();
    if (st.error) throw new Error(st.error);
    if (mine !== previewBgSeq) return;         // 期间参数/素材又变了
    frameCount = st.n_frames; previewFps = st.preview_fps;
    if (st.light_xy_used) lastLightUsed = st.light_xy_used.slice();
    if (st.grid) logicalSize = st.grid.slice();
    if (zoomAuto) zoom = fitZoom();
    applyZoom();
    frames = [];
    for (let i = 0; i < frameCount; i++){
      frames.push("/api/frame?" + qs({ i: i, scale: zoom }));
    }
    framesValid = true;                        // 这组 frames 对应现在参数
    $("scrub").max = Math.max(0, frameCount - 1);
    if (cur >= frameCount) cur = 0;
    $("scrub").value = cur;
    updateReadout(st);
    $("btnPlay").disabled = false;
    $("btnPlay").textContent = tr("播放");
    $("btnPlay").title = "";
    preload(0, Math.min(6, frameCount));
    preload(6, frameCount).then(() => { $("plate").classList.add("on"); });
    toast(`整段就绪 · ${frameCount} 帧 @ ${previewFps}fps（${st.seconds}s 循环）`, "ok");
    // ⚠️ 后台完成不经 renderDone，单独记一份 —— 启动体检要等的就是这个事件
    PAGE_STATE.bg = { ok: true, n_frames: frameCount, ms: Date.now() - mine };
    recordFinal();
  } catch (e){
    if (mine !== previewBgSeq) return;
    psErr("bg-preview", (e && e.stack) || e);
    PAGE_STATE.bg = { ok: false, err: (e && e.message) || String(e) };
    recordFinal();
    toast("整段预览失败：" + e.message, "bad");
    $("btnPlay").disabled = false;
    $("btnPlay").textContent = "播放 ⟳";
    $("btnPlay").title = "点此重渲整段";
  }
}

/* 同步渲整段（点播放时若整段已过期，走这条；这是"值得花那几秒"的时刻） */
async function renderFullPreview(){
  if (busy) return;
  busy = true;
  $("btnPreview").disabled = true;
  stopPlay();
  busyBadgeTimed("渲整段中（为播放准备）…");
  try{
    const fps = 10;
    const r = await fetch("/api/preview?" + qs({ preview_fps: fps, scale: zoom }));
    const st = await r.json();
    if (st.error) throw new Error(st.error);
    sceneStale = false;
    frameCount = st.n_frames; previewFps = st.preview_fps;
    if (st.light_xy_used) lastLightUsed = st.light_xy_used.slice();
    if (st.grid) logicalSize = st.grid.slice();
    if (zoomAuto) zoom = fitZoom();
    applyZoom();
    frames = [];
    for (let i = 0; i < frameCount; i++){
      frames.push("/api/frame?" + qs({ i: i, scale: zoom }));
    }
    framesValid = true;
    $("scrub").max = Math.max(0, frameCount - 1);
    if (cur >= frameCount) cur = 0;
    $("scrub").value = cur;
    updateReadout(st);
    busyBadge("预载帧…");
    await preload(0, Math.min(6, frameCount));
    $("frame").src = frames[cur];
    $("badge").classList.remove("on");
    preload(6, frameCount).then(() => { $("plate").classList.add("on"); });
  } catch (e){
    psErr("full-preview", (e && e.stack) || e);
    toast("整段渲染失败：" + e.message, "bad");
    busyBadge("");
  } finally {
    renderDone();
  }
}
function preload(a, b){
  const jobs = [];
  for (let i = a; i < b; i++){
    const u = frames[i];
    if (!u || imgCache.has(u)) continue;
    jobs.push(new Promise(r => {
      const im = new Image();
      im.onload = im.onerror = () => { imgCache.set(u, 1); r(); };
      im.src = u;
    }));
  }
  return Promise.all(jobs);
}

/* ⭐ 播放按钮的处理（模块级 —— 探针也要走同一条路）。
 *
 * ⚠️ 整段过期时要调 **renderFullPreview**（同步渲整段），不能调 renderPreview：
 *    首帧优先版的 renderPreview 只出一张图就返回（整段在后台补），
 *    回来时 frames 还是空的 → play() 静默不响 —— 「点播放没反应」就是这么来的。
 */
async function onPlayClick(){
  if (playing){ stopPlay(); return; }
  // ⭐ GPU 后端：整段在浏览器里渲，不需要"渲整段帧"这一步
  if (gpuCanRender()){
    if (!gpuRenderer || !gpuRenderer.scene){ await renderPreview(); }
    if (backendActive()){
      // ⚠️ 纵深防御：GPU 不依赖 frames[]，若 invalidateFrames 曾把标记
      //    打成 false（旧版本就会），这里必须复位，否则 play() 静默返回。
      framesValid = true;
      play(); return;
    }
  }
  // ⭐ 点播放才渲整段（这才是值得花那几秒的时刻）。
  //    ⚠️ 判据要同时看"有没有渲过"和"是不是对应当前参数" ——
  //    只看长度会放旧参数的帧（用户报的"跳回预设效果"就是这个）。
  if (!frames.length || !framesValid){ await renderFullPreview(); }
  play();
}

/* ── 播放 ── */
function play(){
  if (!frameCount || !framesValid) return;
  // ⭐ GPU 后端：用 rAF 直接推 t，不逐帧取图
  if (gpuCanRender()){ gpuPlay(); return; }
  playing = true; $("btnPlay").textContent = tr("暂停"); $("btnPlay").title = "";
  const step = () => {
    if (!playing) return;
    $("frame").src = frames[cur];
    $("plate").textContent = `${tr("帧")} ${cur} / ${frameCount - 1}`;
    $("scrub").value = cur;
    $("scrubT").textContent = "t = " + (cur / frameCount).toFixed(2);
    cur = (cur + 1) % frameCount;
    playTimer = setTimeout(step, 1000 / previewFps);
  };
  step();
}
function stopPlay(){
  if (gpuRaf){ cancelAnimationFrame(gpuRaf); gpuRaf = 0; }
  playing = false; clearTimeout(playTimer);
  $("btnPlay").textContent = framesValid ? "播放" : "播放 ⟳";
}

    {k:"光源位置(用到的)", v: st.light_xy_used.map(x => x.toFixed(2)).join(", "),
     c: (Math.abs(st.light_xy_used[0] - st.light_xy[0]) > 0.01) ? "warn" : ""},
    {k:"雾色 / 饱和", v: st.fog_color.map(x => x.toFixed(2)).join(" ") +

     c: (st.fog_sat_actual ?? 0) > 0.45 ? "warn" : ""},

      <div class="amp"><i class="s" style="flex:${Math.max(amp.static,.001)}"></i>

/* ── 素材 ── */
async function loadAssets(keep){
  const r = await fetch("/api/assets");
  const d = await r.json();
  const sel = $("asset");
  const prev = keep || sel.value;
  sel.innerHTML = "";
  let nUp = 0;
  for (const a of d.assets){
    const o = document.createElement("option");
    o.value = a.name;
    o.textContent = (a.origin === "upload" ? "↑ " : "") +
                    a.name.replace(/\.(jpg|jpeg|png|webp|bmp|tif|tiff|gif|avif)$/i, "");
    o.dataset.meta = `${a.w}×${a.h} · ${a.ratio}`;
    o.dataset.origin = a.origin;
    sel.appendChild(o);
    if (a.origin === "upload") nUp++;
  }
  // 有上传的图就优先选中它（用户刚上传，多半就是想用它）
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
  else if (nUp) sel.value = [...sel.options].find(o => o.dataset.origin === "upload").value;
  syncPicker();
  return d.assets.length;
}
function syncPicker(){
  const sel = $("asset");
  const o = sel.selectedOptions[0];
  $("assetMeta").textContent = o ? o.dataset.meta : "";
  $("thumb").src = "/api/still?" + qs({ t: "0", scale: "2" });
  const f = $("frame");
  if (f && !f._mkBound){ f._mkBound = 1; f.addEventListener("load", updateMarker); }
}

/* ── 光源位置标记 ──
   用户反馈：光源非自动时是"纯盲拉 XY 滑杆"，完全看不到拉到哪里。
   这里在画面上叠一个标记，位置按**归一化坐标**换算到图像的显示框内，
   所以缩放窗口也跟得上。 */
function updateMarker(){
  const mk = $("marker");
  const hx = $("chH"), vy = $("chV");
  if (!$("showMarker").checked){
    mk.classList.remove("on"); hx.classList.remove("on"); vy.classList.remove("on"); return;
  }
// ⚠️⚠️ 位置必须量**取景框**（stagebox），不能量 <img>。
  //    GPU 模式下 <img> 是 display:none —— offsetWidth 恒为 0，
  //    于是这里直接 return，**光源标记整个消失**（用户实测症状：
  //    「开启光源位置显示丢失了之前的效果」）。
  //    img 和 canvas 都装在 stagebox 里、CSS 尺寸相同，量它对两条后端都对。
  const box = $("stagebox");
  if (!box.offsetWidth || !box.offsetHeight) return;
  // 手动模式读滑杆的**即时值**（P.rays_x/y），自动模式读服务端实际用的位置。
  // ⚠️ 关键：本函数在滑杆的 oninput 里也会被调用 —— 所以拖动时标记是**跟着走**的，
  //    而不是等渲染返回才跳一下（用户报的"跳变"就是这个）。
  const x = (P.rays_auto_center ? lastLightUsed[0] : P.rays_x);
  const y = (P.rays_auto_center ? lastLightUsed[1] : P.rays_y);
  const W = box.offsetWidth, H = box.offsetHeight;
  mk.style.left = (x * W) + "px";
  mk.style.top  = (y * H) + "px";
  mk.classList.add("on");
  // 十字准线：贯穿全图，边缘钉上数值 —— 这样 X/Y 各在哪一列/行一眼可见
  hx.style.top = Math.round(y * H) + "px";
  vy.style.left = Math.round(x * W) + "px";
  hx.dataset.v = "Y " + y.toFixed(3);
  vy.dataset.v = "X " + x.toFixed(3);
  hx.classList.add("on"); vy.classList.add("on");
  $("markerTag").textContent =
    tr(P.rays_auto_center ? "光源 自动" : "光源 手动") + " " +
    "X " + x.toFixed(2) + "  Y " + y.toFixed(2);
  updateMarker2();
}
/* 副光源标记（青十字）：位置永远是滑杆即时值；仅在副光源开启且
   「光源」显隐开关打开时出现。跟随主标记的所有更新路径（zoom/滑杆/显隐）。 */
function updateMarker2(){
  const mk = $("marker2");
  if (!mk) return;
  if (!$("showMarker").checked || !P.light2_on){
    mk.classList.remove("on"); return;
  }
  const box = $("stagebox");
  if (!box.offsetWidth || !box.offsetHeight) return;
  const x = +P.light2_x || 0, y = +P.light2_y || 0;
  mk.style.left = (x * box.offsetWidth) + "px";
  mk.style.top = (y * box.offsetHeight) + "px";
  mk.classList.add("on");
  $("marker2Tag").textContent = tr("副光源") + " X " + x.toFixed(2) + "  Y " + y.toFixed(2);
}
