/* ══ 显示缩放：让尺寸只由「网格 × 整数倍」决定，与渲染分辨率彻底解耦 ══

   ⚠️ 修的是一个真实的跳变 bug：
   原来 img 用 `max-width:100%`，而拖动参数时为提速渲的是**半分辨率**图，
   半分辨率的图在 CSS 里不会被放大 → 显示尺寸跟着变小；点播放用全分辨率 → 又变大。
   画面一直在跳，用户看得出来。

   根因是**显示尺寸被渲染分辨率牵着走**。现在改成：
     · 服务端只告诉界面「逻辑输出尺寸」（网格 × 整数倍）
     · 界面按 zoom 档位直接设定 stagebox 的像素宽高
     · 拉取的图 scale **等于** zoom → 像素与显示 1:1，既不发虚也不非整数缩放
   这样渲染分辨率怎么变（拖动 / 松手 / 播放），显示尺寸都不动。

   zoom 取**整数**：像素画一旦被非整数缩放，方块就参差不齐 —— 这正是项目一直在防的。 */
let lastLightUsed = [0.5, 0.5];
let zoom = 1;              // 显示倍率（整数）
let zoomAuto = true;       // true = 跟随窗口自适应；滚轮/± 之后变 false（固定）
/* ⚠️ 逻辑尺寸用**像素网格**，不是最终产物尺寸（grid × scene.scale）。
   取后者会导致 480 网格算成 1920px，在小窗口里默认就要滚动 —— 首屏看不到全图。
   用网格尺寸的含义很直观：**×1 = 一个屏幕像素对应一个艺术像素**。 */
let logicalSize = null;    // [gw, gh] 像素网格尺寸

function fitZoom(){
  const st = document.querySelector(".stage");
  if (!st || !logicalSize) return 1;
  const pad = 30;
  const raw = Math.min((st.clientWidth - pad) / logicalSize[0],
                       (st.clientHeight - pad) / logicalSize[1]);
  // 朴素向下取整：绝不默认产生滚动条。想要更大就滚轮推上去（那才会滚动）。
  // 取**整数**是为了像素方正 —— 非整数缩放会让方块参差不齐，正是项目一直在防的。
  return Math.max(1, Math.min(16, Math.floor(raw) || 1));
}
function applyZoom(){
  const box = $("stagebox"), st = document.querySelector(".stage");
  if (!box) return;
  if (!logicalSize){ zoom = Math.max(1, zoom || 1); updateZoomTag(); return; }
  box.style.width = (logicalSize[0] * zoom) + "px";
  box.style.height = (logicalSize[1] * zoom) + "px";
  // 画布的后备缓冲 = 网格尺寸（1:1 上屏）；CSS 尺寸就是上面这个 box 尺寸。
  gpuSyncCanvas();
  if (st) st.classList.toggle("zoomed", zoom > fitZoom());
  syncDebugSize();
  if (zoomAuto) recenterPan();   // 「适应」= 回中 + 适配；手动缩放/拖动保留任意位移
  applyPan();
  updateZoomTag();
  updateMarker();
}
function updateZoomTag(){
  const t = $("zoomTag");
  t.textContent = zoomAuto ? (tr("适应") + " ×" + zoom) : ("×" + zoom);
  t.className = zoomAuto ? "auto" : "";
}
function setZoom(z, manual){
  zoom = Math.max(1, Math.min(16, Math.round(z)));
  zoomAuto = !manual;
  applyZoom();
  // 缩放档变了 → 取图倍率也要跟着变，重取当前帧
  if (frames.length) swapFrame(frames[cur] || frames[0]);
  else renderStillOnly();
}
function zoomBy(delta){
  setZoom((zoomAuto ? fitZoom() : zoom) + delta, true);
}
function bindZoom(){
  const st = document.querySelector(".stage");
  // 滚轮缩放：必须 passive:false 才能 preventDefault（否则页面会跟着滚）
  // ⭐ 以**光标为不动点**（画布语义）：光标下的逻辑坐标
  //    L = (光标 − 世界平移) / 旧倍率；缩放后令 L 仍落在光标下 →
  //    pan' = 光标 − L×新倍率。zoom 是整数档，每档最多偏 1px。
  st.addEventListener("wheel", (e) => {
    if (Math.abs(e.deltaY) < 1) return;
    e.preventDefault();
    const rect = st.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const oldZ = zoomAuto ? fitZoom() : zoom;
    const Lx = (cx - panX) / oldZ, Ly = (cy - panY) / oldZ;
    zoomBy(e.deltaY < 0 ? 1 : -1);
    const newZ = zoomAuto ? fitZoom() : zoom;
    panX = cx - Lx * newZ;
    panY = cy - Ly * newZ;
    applyPan();
  }, { passive: false });
  // 双击：在「适应」与 ×1 之间切换
  st.addEventListener("dblclick", () => {
    if (zoomAuto) setZoom(1, true); else setZoom(fitZoom(), false);
  });
  window.addEventListener("resize", () => { if (zoomAuto){ zoom = fitZoom(); applyZoom(); } });
}
/* ══ 画布平移：**中键拖动** = 移动画布（滚轮已用于缩放）══
   ⚠️ 只用中键 —— 左键拖图片是"拖出去用"（M3-DRAG 的导出语义，不能抢）。 */
function bindPan(){
  const st = document.querySelector(".stage");
  if (!st) return;
  let drag = null;
  st.addEventListener("mousedown", (e) => {
    if (e.button !== 1) return;                 // 仅中键
    e.preventDefault();                          // 阻止浏览器中键自动滚动
    drag = { x: e.clientX, y: e.clientY, px: panX, py: panY };
    st.classList.add("panning");
  });
  window.addEventListener("mousemove", (e) => {
    if (!drag) return;
    panX = drag.px + (e.clientX - drag.x);
    panY = drag.py + (e.clientY - drag.y);
    applyPan();
  });
  window.addEventListener("mouseup", (e) => {
    if (drag && e.button === 1){ drag = null; st.classList.remove("panning"); }
  });
  st.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
}
/* ══ 调试图：与主画面**同一取景框**（渲染图最前，默认全关）══
   布局由张数决定（用户定的规则，无选择器）：
     0 张 → 主画面独占；1-2 张 → 一行并排（渲染图最左）；
     3 张 → 2×2（渲染图左上）。实现：#world 的 quad 类 + 子元素 order。
   服务端 /api/debug 出 PNG。URL 携带全部当前参数 → 同参数命中浏览器缓存；
   参数一变 URL 变 → 自动换新图。图上绿十字 = 渲染真正使用的光源位置。 */
const DEBUG_KINDS = [
  ["dbgDepth", "depth", "深度图（暗=近 蓝=远）"],
  ["dbgLuma", "luma", "等亮线（蓝90 橙95 红99 分位）"],
  ["dbgVol", "vol", "体积光形状（归一化）"],
];
function debugOn(){ return DEBUG_KINDS.some(k => $(k[0]) && $(k[0]).checked); }
function syncDebugSize(){
  /* 调试图与主画面同宽（stagebox 是 zoom 定的显式 px，跟它对齐才等高） */
  const box = $("stagebox");
  if (!box || !box.offsetWidth) return;
  document.querySelectorAll("#world .dbgcell img").forEach(im => { im.style.width = box.offsetWidth + "px"; });
}
/* ══ 画布平移（transform 版，**全自由**画布）══
   ⚠️ 不用 scrollLeft：滚动平移的范围被内容边界限死（用户实测"范围太小"），
   且滚动容器里的绝对定位元素（帧指示器）会跟着"飞走"。transform 版两者皆无。
   ⚠️ 全自由 = **无边界钳制**：内容可以拖到画布任意位置（包括完全出界），
   「适应」键 = 回中 + 适配（zoomAuto 路径每次 applyZoom 都 recenter）。
   panX/panY = 世界层的平移量。 */
let panX = 0, panY = 0;
function applyPan(){
  const world = $("world");
  if (world) world.style.transform = "translate(" + panX + "px," + panY + "px)";
}
function recenterPan(){
  const st = document.querySelector(".stage"), world = $("world");
  if (!st || !world) return;
  panX = (st.clientWidth - 28 - world.offsetWidth) / 2;
  panY = (st.clientHeight - 28 - world.offsetHeight) / 2;
}
function refreshDebug(){
  const world = $("world");
  if (!world) return;
  const want = DEBUG_KINDS.filter(k => $(k[0]) && $(k[0]).checked);
  [...world.querySelectorAll(".dbgcell")].forEach(c => {
    if (!want.some(k => k[1] === c.dataset.kind)) c.remove();
  });
  world.classList.toggle("quad", want.length >= 3);
  want.forEach(([id, kind, cap], i) => {
    let cell = world.querySelector('.dbgcell[data-kind="' + kind + '"]');
    if (!cell){
      cell = document.createElement("div");
      cell.className = "dbgcell";
      cell.dataset.kind = kind;
      const im = document.createElement("img");
      im.alt = cap;
      const cp = document.createElement("span");
      cp.className = "cap"; cp.textContent = tr(cap);
      cell.appendChild(im); cell.appendChild(cp);
      world.appendChild(cell);
    }
    cell.style.order = i + 1;
    const capEl = cell.querySelector(".cap");
    if (capEl) capEl.textContent = tr(cap);
    const src = "/api/debug?kind=" + kind + "&" + qs({});
    const im = cell.querySelector("img");
    if (im.dataset.src !== src){ im.dataset.src = src; im.src = src; }
  });
  $("stagebox").style.order = "0";
  syncDebugSize();
}
let dbgTimer = 0;
function scheduleDebug(){
  if (!debugOn()) return;
  clearTimeout(dbgTimer);
  dbgTimer = setTimeout(refreshDebug, 300);
}

/* 取逻辑输出尺寸（不渲染）。尺寸只认这个，不认拉回来的图有多大。 */
async function refreshMeta(){
  try{
    const r = await fetch("/api/meta?" + qs({}));
    const d = await r.json();
    if (d.error) return;
    if (d.grid) logicalSize = d.grid.slice();
    if (d.light_xy_used) lastLightUsed = d.light_xy_used.slice();
    if (zoomAuto) zoom = fitZoom();
    applyZoom();
  } catch (e) { /* 元信息拿不到就用旧值，不打断流程 */ }
}

/* ── 上传：让管线不限于内置样例 ── */
async function uploadFile(file){
  if (!file) return;
  if (!file.type.startsWith("image/") && !/\.(jpe?g|png|webp|bmp|tiff?|gif|avif)$/i.test(file.name)){
    toast("这不是图片文件：" + file.name, "bad");
    return;
  }
  busyBadge("上传中…");
  try{
    const url = "/api/upload?name=" + encodeURIComponent(file.name);
    const r = await fetch(url, { method: "POST", body: file });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    await loadAssets(d.name);
    sceneStale = true;
    toast(`已载入 ${d.name}（${d.w}×${d.h}，${(d.bytes/1048576).toFixed(1)} MB）`, "ok");
    renderPreview();
  } catch (e){
    toast("上传失败：" + e.message, "bad");
    busyBadge("");
  }
}
function bindUpload(){
  $("btnUpload").onclick = () => $("fileInput").click();
  $("thumbBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = () => {
    uploadFile($("fileInput").files[0]);
    $("fileInput").value = "";        // 允许重复选同一个文件
  };
  /* ── 整窗拖放上传 ──

     ⚠️ 必须严格区分「外部文件拖入」与「页面内元素被拖动」，否则极易误上传。

     用户报障：拖动预览画面那张图（想把这张成图拖出去用），
     页面上却弹出"松手以载入这张图片"的遮罩 —— 松手就上传，很烦。

     用**三层判据**，任一层判定为"内部拖动"就拒绝上传：

       ① `internalDrag` 标记（最可靠）：页面内任何元素开始拖动时，
          `dragstart` 会在文档里触发 —— 外部拖入则**没有** dragstart。
          这个判据**不依赖 `dataTransfer.types`**，也就不受浏览器差异影响。
       ② `types` 含 `"Files"`：外部文件拖入的唯一特征
          （页面内拖动 img 时是 `["text/uri-list","text/html","text/plain"]`）。
       ③ drop 阶段还要求 `files.length > 0`：规范里 `dataTransfer.files`
          只在 drop 时才可读，dragenter/dragover 阶段是空的 —— 所以
          ①② 用于前两个阶段，③ 用于 drop。

     ⚠️ 另外原来的 `dragleave` 用 `--depth` 计数管理遮罩，跨子元素边界时
     计数会失衡，导致遮罩闪烁或残留。改成 **dragover 刷新时间戳**：
     每次 dragover 重置一个短定时器，停 260ms 没有新事件就自动隐藏。
     这个写法不依赖事件配平，天然免疫计数错乱。 */
  const dz = $("dropzone");
  let internalDrag = false;
  let dzTimer = null;

  function showDropzone(){
    dz.classList.add("on");
    clearTimeout(dzTimer);
    dzTimer = setTimeout(hideDropzone, 260);   // dragover 会持续刷新
  }
  function hideDropzone(){
    clearTimeout(dzTimer); dzTimer = null;
    dz.classList.remove("on");
  }

  /* ① 内部拖动标记。dragstart/dragend 用捕获阶段监听（true），
        这样即使子元素 stopPropagation 也拿得到。
        ⚠️ 不 preventDefault —— 用户可能就是要**把成图拖出去**用，
        那是正常需求，我们只打标记让上传逻辑让路。 */
  window.addEventListener("dragstart", () => { internalDrag = true; hideDropzone(); }, true);
  window.addEventListener("dragend", () => { internalDrag = false; hideDropzone(); }, true);

  /* ②③ 只有外部文件拖入才认 */
  function isExternalFileDrag(e){
    if (internalDrag) return false;
    const t = e.dataTransfer && e.dataTransfer.types;
    return !!t && Array.prototype.includes.call(t, "Files");
  }

  window.addEventListener("dragenter", (e) => {
    if (!isExternalFileDrag(e)) return;
    e.preventDefault(); showDropzone();
  });
  window.addEventListener("dragover", (e) => {
    if (!isExternalFileDrag(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "copy"; showDropzone();
  });
  /* 不再需要 dragleave —— 遮罩由 dragover 的时间戳定时器自己收 */

  window.addEventListener("drop", (e) => {
    /* ⚠️ 任何 drop 都**先**阻止默认行为，不分情况。

       不阻止的话浏览器会按拖入内容做导航：
         · 页面内拖动的 img  → 导航到图片 URL（预览图是 `/api/still?...`，
           跳过去就是满屏一张图，调参界面被冲掉）
         · 外部文件          → 直接打开那个文件
       两种都会把界面弄没，所以这一步与"是不是要上传"无关，无条件做。

       先阻止、再分派，也让下面的分支不必各自记着 preventDefault
       （原先只有部分分支做了，漏一条就是一个"拖一下就白屏"的 bug）。 */
    e.preventDefault();
    hideDropzone();

    if (internalDrag) return;                 // 页面内拖动：到此为止，绝不上传

    if (!isExternalFileDrag(e)){
      // 外部拖入但我们不认（多半是从别的网页拖来的图片链接）。
      // 原本是静默无反应，用户会以为"拖坏了" —— 给个明确解释。
      const types = (e.dataTransfer && e.dataTransfer.types) || [];
      if (Array.prototype.includes.call(types, "text/uri-list")){
        toast("这是一个网页图片链接，不是本地文件。请先把它保存到本地，再拖进来。");
      }
      return;
    }

    const files = e.dataTransfer && e.dataTransfer.files;          // ③ drop 阶段才可读
    if (!files || !files.length) return;
    uploadFile(files[0]);
  });
}

/* ── 左键拖图出画面 = 单帧出图 ──
 * 提供当前帧的**服务端渲染 URL**（t/scale 与画面一致）；拖到资源管理器/
 * 桌面即下载该帧。两条后端都可拖（GPU 模式下 URL 仍是服务端渲染帧，
 * 两链路已逐位验收一致）；拖回页面 = 换素材的上传语义（守卫照旧）。
 * ⚠️ v1 曾依赖浏览器对 <img> 的原生拖拽，自由画布改造后不可靠 → 显式实现。 */
function frameDragStart(e){
  const t = (cur / Math.max(1, frameCount || 1)).toFixed(4);
  const url = new URL("/api/still?" + qs({ t, scale: zoom }), location.href).href;
  e.dataTransfer.setData("text/uri-list", url);
  e.dataTransfer.setData("text/plain", url);
  e.dataTransfer.effectAllowed = "copy";
}
$("frame").addEventListener("dragstart", frameDragStart);

async function doExport(){
  if (busy) return;
  try{
    const r = await fetch("/api/export", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ params: P, asset: $("asset").value, format: "webp" })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    toast("已开始全量渲染（480 网格，约 30~60 秒）…");
    const poll = async () => {
      const j = await (await fetch("/api/job?id=" + d.job)).json();
      if (j.state === "running"){
        busyBadge(`全量渲染 ${j.done}/${j.total}`);
        setTimeout(poll, 700);
      } else {
        busyBadge("");
        if (j.state === "done"){
          toast(tr("出图完成") + " · " + j.msg + tr("，已开始下载"), "ok");
          // ⭐ 走浏览器下载通道：服务端 Content-Disposition attachment →
          //    文件直接落到用户的下载目录（idx0=动画，idx1=首帧 PNG）
          (j.files || []).forEach((f, i) => {
            setTimeout(() => {
              const a = document.createElement("a");
              a.href = "/api/export_file?job=" + d.job + "&idx=" + i;
              document.body.appendChild(a); a.click(); a.remove();
            }, 700 * (i + 1));
          });
        } else toast("出图失败：" + j.msg, "bad");
      }
    };
    poll();
  } catch (e){ toast("出图失败：" + e.message, "bad"); }
}

/* ── 仪表条：高度与每栏宽度可拖拽 ──
 *
 * 判别栏用它的**标签文字**（.k）当 key —— 每次读数刷新都会重建 DOM，
 * 宽度存在 localStorage 里按 key 回填，这样拖出来的布局在刷新后还在。
 * 横向放不下时 .readout 自己横向滚动，内容不会再被截断。 */
let roWidths = {};
try { roWidths = JSON.parse(localStorage.getItem("roWidths") || "{}"); } catch (e) { roWidths = {}; }

function decorateReadout(){
  const ro = $("readout");
  for (const cell of ro.querySelectorAll(".cell")){
    const kEl = cell.querySelector(".k");
    const key = kEl ? kEl.textContent : "";
    const w = roWidths[key];
    if (w) cell.style.flex = "0 0 " + w + "px";
    const v = cell.querySelector(".v");
    if (v && !v.title) v.title = v.textContent;      // 悬停看被省略号吞掉的全文
    const div = document.createElement("div");
    div.className = "ro-div";
    div.title = "左右拖动调整「" + key + "」栏宽；双击复位";
    div.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const startW = cell.getBoundingClientRect().width;
      const startX = e.clientX;
      const move = (ev) => {
        const w2 = Math.max(96, Math.min(640, startW + ev.clientX - startX));
        cell.style.flex = "0 0 " + w2 + "px";
        roWidths[key] = w2;
      };
      const up = () => {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
        try { localStorage.setItem("roWidths", JSON.stringify(roWidths)); } catch (e2) {}
      };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
    div.addEventListener("dblclick", () => {
      delete roWidths[key];
      cell.style.flex = "";
      try { localStorage.setItem("roWidths", JSON.stringify(roWidths)); } catch (e2) {}
    });
    cell.insertAdjacentElement("afterend", div);
  }
}

function initRoHeight(){
  const h = parseFloat(localStorage.getItem("roHeight"));
  if (h && isFinite(h)) document.documentElement.style.setProperty("--ro-h", h + "px");
  $("roHandle").addEventListener("mousedown", (e) => {
    e.preventDefault();
    const startH = $("readout").getBoundingClientRect().height;
    const startY = e.clientY;
    const move = (ev) => {
      const h2 = Math.max(36, Math.min(window.innerHeight * 0.6, startH + (startY - ev.clientY)));
      document.documentElement.style.setProperty("--ro-h", h2 + "px");
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      const h3 = $("readout").getBoundingClientRect().height;
      try { localStorage.setItem("roHeight", String(Math.round(h3))); } catch (e2) {}
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  $("roHandle").addEventListener("dblclick", () => {
    document.documentElement.style.removeProperty("--ro-h");
    try { localStorage.removeItem("roHeight"); } catch (e2) {}
  });
}

/* ── 启动 ── */
/* ══════════════════════════════════════════════════════════════════
 * WebGPU 渲染后端
 *
 * ⚠️ 设计上的三条硬要求：
 *
 *   ① **必须能回退。** 没有 WebGPU 的浏览器/设备要照旧能用 —— GPU 是加速手段
 *      不是必需条件。任何一步失败（无 navigator.gpu / 拿不到适配器 /
 *      着色器编译失败 / 设备丢失）都要静默切回服务端，并且**说清原因**。
 *
 *   ② **服务端路径一行都不能动。** 它现在是"标准答案"：验收台比的就是它。
 *      所以这里做的是"在它旁边加一条路"，而不是改造它。
 *
 *   ③ **画面尺寸逻辑共用。** 画布的后备缓冲 = 像素网格尺寸，CSS 尺寸 =
 *      网格 × 整数 zoom —— 与服务端的 img 走的是同一个 applyZoom。
 *      这样切后端画面不会跳尺寸（那个 bug 我们已经修过一次了）。
 * ══════════════════════════════════════════════════════════════════ */
/* ⚠️ 加 `?backend=server` 可以**确定性**地锁定服务端渲染。
 *
 *    为什么需要它：验回退路径时我先是"去掉无头 WebGPU 开关"，结果
 *    无头 Edge 这版**默认就带 WebGPU**，于是验的是 GPU 路径 ——
 *    **判据判错了对象**，还真报出几条"服务端模式下……"的假问题。
 *    用 URL 参数锁定就没有这种不确定性：不看浏览器脸色。 */
/* ═══ 后端选择 ═══
 *
 * ⭐ **默认是服务端渲染（CPU）。** GPU 要**显式开启**：`?backend=gpu`，或点「后端」按钮。
 *
 *    为什么默认不开（2026-09-12 用户实测的结论）：渲染链本身是好的
 *    （与验收台逐像素比对 1.13%、循环闭合逐位相同），但**交互路径**
 *    （播放 / 滑杆 / 切图 / 光源标记）没有逐一接线验证，用户实测
 *    "前端功能好像全都爆掉了"。**先保证工具可用**；GPU 的交互修完
 *    并用交互探针验过之前，只作为可选项存在。
 *
 *    `?backend=server` / `?backend=gpu` 都能**确定性**地锁定
 *    （不靠浏览器脸色 —— 实测无头 Edge 默认就带 WebGPU，靠 flag 会验错对象）。 */
let backendPref = (function(){
  try {
    const v = new URLSearchParams(location.search).get("backend");
    return v === "gpu" ? "auto" : "server";   // 默认（无参数）= 服务端
  } catch (e) { return "server"; }
})();        // 'auto'（= GPU 已开）| 'server'
let gpuRenderer = null, gpuReady = false, gpuReason = '', gpuInfo = '';
let gpuSceneKey = '', gpuAssetsKey = '';

let gpuRaf = 0;

function backendActive(){ return gpuReady && backendPref !== 'server'; }

/* "这一帧能不能用 GPU 渲"的**唯一**判定点。
 *
 * 视差（M5）已移植到 GPU（parallax_splat / parallax_apply 两个 pass，
 * 前向 splatting + u32 定点原子累加），所以现在它就是 backendActive()。
 * 保留这个函数是为了**以后再有服务端专属特性时有一个明确的挂点** ——

//: 进行中的初始化 Promise —— 幂等要靠它，不能只看 `gpuRenderer`。
let gpuInitPromise = null;

async function _initBackendOnce(){
  // ⚠️ **必须幂等**。一个 canvas 只能属于一个 device：
  //    第二次 `ctx.configure()` 会把画布交给新 device，于是旧 device 的
  //    `getCurrentTexture()` 返回的纹理**属于另一个 device**，
  //    渲染时报 "TextureView is associated with [Device], and cannot be used
  //    with [Device]"，**整个 command buffer 被静默丢弃** ——
  //    所有 dispatch 都不执行，输出全黑，而且 submit 不抛异常。
  //    （这个坑实测花了一轮：先以为渲染链坏了，逐缓冲诊断才发现连
  //      直接从场景包上传的 base/far 都是 0。）
  if (backendPref === "server"){
    // 被 `?backend=server` 显式锁定：**连设备都不要建**（建了也没人用，
    // 还会占着一个 canvas —— 而 canvas 只能属于一个 device）。
    gpuReason = "被 URL 参数锁定";
    gpuBtn("server", "后端：服务端", "已用 ?backend=server 锁定服务端渲染");
    return;
  }
  if (!("gpu" in navigator)){
    gpuReason = "浏览器没有 WebGPU";
    backendPref = "server";
    gpuBtn("server", "后端：服务端", gpuReason + "（用服务端渲染）");
    return;
  }
  try{
    gpuBtn("server", "后端：初始化…", "正在初始化 WebGPU");
    const r = new GpuRenderer($("gpuCanvas"));
    await r.init();
    gpuRenderer = r;
    gpuReady = true;
    gpuInfo = r.info;
    $("stagebox").classList.add("gpu");
    gpuBtn("gpu", "后端：GPU ✓", "WebGPU 加速中\n" + r.info);
    // ⚠️ 把 GPU 脚本的**版本指纹**放进标题：同一 URL 的脚本被浏览器缓存后，
    //    "你跑的是哪一版"就无法从画面判断（实测：缓存 1h 的旧 JS 会让
    //    GPU 模式唯独缺光柱）。指纹一致 = 两边跑的是同一份代码。
    fetch("/api/gpuasset?name=m3_wgsl_uniforms").then(function (r2) {
      return r2.text();
    }).then(function (txt) {
      var hsh = 0;
      for (var i = 0; i < txt.length; i++) { hsh = (hsh * 31 + txt.charCodeAt(i)) | 0; }
      gpuBuild = (hsh >>> 0).toString(16).slice(0, 8);
      document.title = "pixelart · build " + gpuBuild;
      ps("build", { gpuBuild: gpuBuild });
    }).catch(function () {});
    /* ⚠️⚠️ 设备级错误**必须常驻回报**。
     * WebGPU 的校验错误默认只在控制台打一行，而**整条 command buffer 会被丢弃** ——
     * 症状就是"画布全黑但不报错"。实测：接上视差链后首帧全黑，
     * 页面诊断里一条错误都没有，只能靠这个 handler 找到原因。 */
    r.dev.addEventListener("uncapturederror", (ev) => {
      psErr("gpu-uncaptured", ev.error && ev.error.message
        ? ev.error.message : String(ev.error));
    });
    toast("已启用 WebGPU 渲染（" + r.info + "）", "ok");
    // ⚠️ 设备丢失（驱动重置 / 显存不足 / 远程会话切换）是**运行时**事件：
    //    不挂这个钩子的话，症状是"用着用着所有按钮静默失灵"（用户实测遇到过
    //    "莫名其妙好了/坏了"的切换）。丢了就自动回退服务端并明说。
    r.dev.lost.then((info) => {
      psErr("device-lost", (info && (info.message || info.reason)) || "device lost");
      gpuReady = false; gpuRenderer = null;
      stopPlay();
      $("stagebox").classList.remove("gpu");
      gpuBtn("bad", "后端：服务端", "GPU 设备丢失已自动回退：" + ((info && info.message) || ""));
      toast("GPU 设备丢失，已切回服务端渲染", "bad");
      renderPreview();
    });
  } catch (e){
    gpuReason = e && e.message ? e.message : String(e);
    gpuReady = false;
    gpuRenderer = null;
    gpuBtn("bad", "后端：服务端", "WebGPU 不可用：" + gpuReason + "\n已切回服务端渲染");
    // ⚠️ 必须回报 —— 这里是**静默失败**的典型位置：异常被 catch 住、
    //    界面只是悄悄把后端标成"服务端"，页面诊断里连一条错误都没有
    //    （实测：探针跑了整轮才发现 GPU 根本没起来，而 errors 为空）。
    psErr("gpu-init", ((e && e.stack) || gpuReason) + " | reason=" + gpuReason);
    console.warn("[webgpu] 初始化失败，回退服务端：", gpuReason);
  }
}

/* ⚠️⚠️ 幂等必须靠**记住进行中的那个 Promise**，不能只判断 `gpuRenderer`。
 *
 *    `runGpuSelfTest()` 与 `refreshMeta().then(initBackend)` 是**并发**发起的：
 *    两个调用都会在第一个 `await` 之前看到 `gpuRenderer === null`
 *    （因为赋值发生在 `await r.init()` 之后），于是**各建一个 device**。
 *    两个 device 都 configure 同一个 canvas → 后者的纹理归后者，
 *    前者渲染时报 "TextureView is associated with [Device] …"，
 *    整条 command buffer 被静默丢弃 → **输出全黑且不报错**。
 *
 *    只看结果状态的幂等是**假幂等**：并发的调用者都还没看到结果。
 *    正确做法是把"进行中的 Promise"本身存下来，后来者直接 await 它。
 */
function initBackend(){
  if (gpuRenderer && gpuReady) return Promise.resolve();
  if (gpuInitPromise) return gpuInitPromise;
  gpuInitPromise = _initBackendOnce().finally(() => { gpuInitPromise = null; });
  return gpuInitPromise;
}

/* 画布尺寸：后备缓冲 = 网格；CSS 尺寸由 applyZoom 统一管 */
function gpuSyncCanvas(){
  if (!backendActive() || !gpuRenderer || !gpuRenderer.scene) return;
  const g = gpuRenderer.scene;
  const c = $("gpuCanvas");
  if (c.width !== g.W || c.height !== g.H){ c.width = g.W; c.height = g.H; }
}

async function gpuEnsureScene(force){
  if (!backendActive()) return false;
  const key = sceneKeyNow();
  if (!force && key === gpuSceneKey && gpuRenderer.scene) return true;
  const r = await fetch("/api/scene?" + qs({ parts: "scene,assets" }));
  const buf = await r.arrayBuffer();
  const pack = GpuRenderer.decodePack(buf);
  gpuRenderer.setScene(pack);
  gpuRenderer.setAssets(pack);          // 一次性拿到 assets（parts 里带了）
  gpuSceneKey = key;
  gpuAssetsKey = assetsKeyNow();
  logicalSize = pack.meta.grid.slice();
  if (zoomAuto) zoom = fitZoom();
  gpuSyncCanvas();
  applyZoom();
  gpuPreviewStats = gpuStatsFromPack(pack);
  updateReadoutGpu();
  gpuLoopSelfCheck();
  return true;
}

/* 只刷新"素材"（色板 / 核 / 粒子）—— 拖滑杆时用，debounce 过 */
let gpuAssetsTimer = 0;
function gpuScheduleAssets(){
  if (!backendActive()) return;
  clearTimeout(gpuAssetsTimer);
  gpuAssetsTimer = setTimeout(async () => {
    if (!backendActive()) return;
    const key = assetsKeyNow();
    if (key === gpuAssetsKey) return;
    try{
      const r = await fetch("/api/scene?" + qs({ parts: "assets" }));
      const pack = GpuRenderer.decodePack(await r.arrayBuffer());
      // 只带 assets 的包没有 base/far —— 把它们补回去，否则 setScene 会清掉缓冲
      const merged = {
        meta: Object.assign({}, gpuRenderer.scene.meta, pack.meta),
        segs: Object.assign({}, gpuRenderer._sceneSegs, pack.segs)
      };
      gpuRenderer.setAssets(merged);
      gpuAssetsKey = key;
      // ⚠️⚠️ gpuStatsFromPack 会把 loop_ok 重置回 null（"检测中…"）。
      //    旧版本在这里直接覆盖，于是**每拖一次素材类滑杆，
      //    循环闭合读数就永远卡回"检测中…"** —— 没有任何人再跑一次自检
      //    （gpuLoopSelfCheck 只在 gpuEnsureScene 里被调）。
      //    修法：保留旧 verdict（循环闭合是结构性质，不随色板/粒子变），
      //    再重跑一次自检刷新。
      const prev = gpuPreviewStats;
      gpuPreviewStats = gpuStatsFromPack(merged);
      if (prev){
        gpuPreviewStats.loop_ok = prev.loop_ok;
        gpuPreviewStats.loop_diff = prev.loop_diff;
      }
      updateReadoutGpu();
      gpuLoopSelfCheck();
    } catch (e){ /* 素材刷新失败不打断渲染，继续用旧色板 */ }
  }, 260);
}

function gpuStatsFromPack(pack){
  const m = pack.meta;
  return {
    grid: m.grid, scale: m.scale, out_size: m.out_size,
    palette_size: m.palette_len || 0,
    light_xy_used: m.light_xy,
    dust_count: m.dust_count || 0,
    loop_ok: null, loop_diff: null, loop_err: null
  };
}

/* ⭐ 在 GPU 上自检循环闭合：frame(t=1) 是否与 frame(t=0) 逐位相同。
 *
 * 这是时序铁律 3 的直接检验，而且是在**真实 GPU 上**跑的 ——
 * 验收台已经证明过着色器的循环性，这里再确认一次"组装起来之后"仍然成立。
 * 一次读回很便宜（只做一次，不是每帧）。
 */
const _gpuReadBuf = { buf: null, size: 0 };
let gpuSelfCheckBusy = false, gpuSelfCheckPending = false;
async function gpuLoopSelfCheck(){
  if (!backendActive() || !gpuRenderer || !gpuRenderer.scene) return;
  // ⚠️ 重入守卫：拖素材类滑杆时 gpuScheduleAssets 每次都会调这里，
  //    上一次还没跑完就再来一次会互相踩（并发 render + 同一个读回缓冲）。
  //    忙时记一个"待办"，跑完补一次 —— 只保留最新一份结论。
  if (gpuSelfCheckBusy){ gpuSelfCheckPending = true; return; }
  gpuSelfCheckBusy = true;
  try {
    await gpuLoopSelfCheckInner();
  } finally {
    gpuSelfCheckBusy = false;
    if (gpuSelfCheckPending){ gpuSelfCheckPending = false; gpuLoopSelfCheck(); }
  }
}
async function gpuLoopSelfCheckInner(){
  const r = gpuRenderer, d = r.dev;
  const bytes = r.scene.npix * 4;
  if (!_gpuReadBuf.buf || _gpuReadBuf.size !== bytes){
    if (_gpuReadBuf.buf) _gpuReadBuf.buf.destroy();
    _gpuReadBuf.buf = d.createBuffer({
      size: bytes, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    _gpuReadBuf.size = bytes;
  }
  const shot = (t) => {
    r.render(P, t);
    const enc = d.createCommandEncoder();
    enc.copyBufferToBuffer(r.buf.packed, 0, _gpuReadBuf.buf, 0, bytes);
    d.queue.submit([enc.finish()]);
    return _gpuReadBuf.buf.mapAsync(GPUMapMode.READ).then(() => {
      const a = new Uint32Array(_gpuReadBuf.buf.getMappedRange().slice(0));
      _gpuReadBuf.buf.unmap();
      return a;
    });
  };
  try{
    const a = await shot(0.0);
    const b = await shot(1.0);
    let mx = 0;
    for (let i = 0; i < a.length; i++){
      const d0 = Math.abs((a[i] & 0xFFFFFF) - (b[i] & 0xFFFFFF));
      if (d0 > mx) mx = d0;
    }
    gpuPreviewStats.loop_ok = (mx === 0);
    gpuPreviewStats.loop_diff = mx;
    updateReadoutGpu();
  } catch (e){
    // ⚠️ 自检失败必须**可见**。旧版本静默把 loop_ok 留在 null ——
    //    读数就永远停在「检测中…」，用户以为是在等，其实已经炸了。
    psErr("loop-selfcheck", (e && e.message) || String(e));
    gpuPreviewStats.loop_ok = null;
    gpuPreviewStats.loop_err = (e && e.message) || String(e);
    updateReadoutGpu();
  }
  r.render(P, cur / Math.max(1, frameCount || 1));
}

/* GPU 模式下的仪表读数：只报我们**真的知道**的东西。
 * ⚠️ 服务端那套"相邻帧差/半周期差"需要整段帧，GPU 模式下没有 —— 
 *    与其编一个数出来，不如空着并说明原因。 */
function updateReadoutGpu(){
  const st = gpuPreviewStats;
  if (!st){ $("readout").innerHTML = ""; return; }
  const cells = [
    {k:"渲染后端", v: "WebGPU（浏览器内）", c:"ok"},
    {k:"设备", v: gpuInfo || "—"},
    {k:"循环闭合 frame(0)==frame(N)",
     v: st.loop_err ? ("自检失败：" + st.loop_err)
      : (st.loop_ok === null ? "检测中…" : (st.loop_ok ? "逐位相同" : "接缝 " + st.loop_diff)),
     c: st.loop_err ? "bad" : (st.loop_ok === null ? "" : (st.loop_ok ? "ok" : "bad"))},
    {k:"色板", v: st.palette_size + " 色（服务端定，全片共用）", c:"ok"},
    {k:"网格 / 输出", v: `${st.grid[0]}×${st.grid[1]} ×${st.scale} → ${st.out_size[0]}×${st.out_size[1]}`},
    {k:"显示倍率", v: (zoomAuto ? tr("适应") + " " : "") + "×" + zoom +
      `  (${st.grid[0] * zoom}×${st.grid[1] * zoom} 屏幕像素)`},
    {k:"尘埃", v: st.dust_count + " 颗（u32 定点原子加）"},
    {k:"光源位置(用到的)", v: st.light_xy_used.map(x => x.toFixed(2)).join(", ")},
  ];
  $("readout").innerHTML = cells.map(c => `<div class="cell"><div class="k">${tr(c.k)}</div>
      <div class="v ${c.c || ""}">${c.v}</div></div>`).join("");
  $("readout").insertAdjacentHTML("beforeend",
    `<div class="cell"><div class="k">${tr("说明")}</div>
     <div class="v">GPU 模式下相邻帧差/动画幅度需要整段帧，未统计；
     服务端渲染时才有。切到「服务端」可看完整仪表。</div></div>`);
  decorateReadout();
}

/* GPU 播放：用 requestAnimationFrame 直接推 t，不再逐帧取图 */
function gpuPlay(){
  stopPlay();
  const secs = Math.max(0.5, +P.seconds || 6);
  const t0 = performance.now() - (cur / Math.max(1, frameCount || 1)) * secs * 1000;
  playing = true;
  $("btnPlay").textContent = tr("暂停");
  const step = () => {
    if (!playing || !backendActive()) return;
    const el = (performance.now() - t0) / 1000;
    const t = (el / secs) % 1;
    cur = Math.floor(t * frameCount);
    gpuRenderer.render(P, t);
    $("plate").textContent = `${tr("帧")} ${cur} / ${Math.max(0, frameCount - 1)}`;
    $("scrubT").textContent = "t = " + t.toFixed(2);
    $("scrub").value = cur;
    updateMarker();
    gpuRaf = requestAnimationFrame(step);
  };
  gpuRaf = requestAnimationFrame(step);
}


/* ══════════════════════════════════════════════════════════════════
 * 浏览器内自检（`?selftest=1`）
 *
 * 为什么要有它：浏览器侧的 WebGPU 代码**只有在真浏览器里才会执行**，
 * 所以"着色器能编译""管线建得起来""链跑得通""循环闭合"这些问题，
 * 按常理只能在打开浏览器后才发现。
 *
 * 这个自检把结果 POST 回服务端（复用参数存档接口，不新增路由），
 * 于是**无人值守的脚本也能验证真实浏览器里的 WebGPU 路径** ——
 * 无头 Edge/Chrome 打开 ?selftest=1 就够了。
 *
 * 报告里带一帧的**原始打包像素**（base64），这样服务端能拿它和
 * 自己（或验收台）渲染的同一帧逐像素比对 —— 那才是真正的端到端验证。
 * ══════════════════════════════════════════════════════════════════ */
function _b64(u8){
  let s = "";
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return btoa(s);
}

async function runGpuSelfTest(){
  const rep = { ok:false, stage:"start", ts:Date.now() };
  try{
    rep.stage = "navigator.gpu";
    if (!("gpu" in navigator)){ rep.reason = "navigator.gpu 不存在"; throw new Error(rep.reason); }

    rep.stage = "adapter";
    // ⚠️ 用 initBackend 建好的那一个 renderer，**不要在这里 new 第二个**。
    //    一个 canvas 只能归一个 device；两个 device 各 configure 一次之后，
    //    先建的那个渲染时会被 WebGPU 拒绝（纹理属于另一个 device），
    //    整条 command buffer 被丢掉 → 全黑 + 不报错。
    await initBackend();
    if (!gpuReady || !gpuRenderer) throw new Error("WebGPU 不可用：" + (gpuReason || "未知"));
    const r = gpuRenderer;
    rep.adapter = r.info;
    // 设备级错误也要抓（上传/建缓冲的错会在这里）
    r.dev.addEventListener("uncapturederror", (ev) => {
      (rep.gpuErrors = rep.gpuErrors || []).push("uncaptured: " + ev.error.message);
    });
    rep.limits = r.dev.limits ? {
      maxStorageBufferBindingSize: r.dev.limits.maxStorageBufferBindingSize,
      maxBufferSize: r.dev.limits.maxBufferSize,
      maxComputeWorkgroupsPerDimension: r.dev.limits.maxComputeWorkgroupsPerDimension
    } : null;
    // 设备级错误也要抓（上传/建缓冲的错会在这里）
    r.dev.addEventListener("uncapturederror", (ev) => {
      (rep.gpuErrors = rep.gpuErrors || []).push("uncaptured: " + ev.error.message);
    });
    rep.limits = r.dev.limits ? {
      maxStorageBufferBindingSize: r.dev.limits.maxStorageBufferBindingSize,
      maxBufferSize: r.dev.limits.maxBufferSize,
      maxComputeWorkgroupsPerDimension: r.dev.limits.maxComputeWorkgroupsPerDimension
    } : null;

    // ⚠️⚠️ 捕获 GPU 侧的校验错误。
    //
    //    实测第一次跑通时**所有缓冲都是 0**（连直接从场景包上传的 base/far 也是），
    //    但 render() 返回 true、submit 不抛异常 —— 因为 WebGPU 的校验错误
    //    默认**只是在控制台打一行警告**，命令缓冲被静默丢弃。
    //    没有这个 error scope，就只能看到"输出全黑"然后瞎猜。
    r.dev.pushErrorScope("validation");
    r.dev.pushErrorScope("out-of-memory");
    rep.gpuErrors = [];

    // ⚠️⚠️ 捕获 GPU 侧的校验错误。
    //
    //    实测第一次跑通时**所有缓冲都是 0**（连直接从场景包上传的 base/far 也是），
    //    但 render() 返回 true、submit 不抛异常 —— 因为 WebGPU 的校验错误
    //    默认**只是在控制台打一行警告**，命令缓冲被静默丢弃。
    //    没有这个 error scope，就只能看到"输出全黑"然后瞎猜。
    r.dev.pushErrorScope("validation");
    r.dev.pushErrorScope("out-of-memory");
    rep.gpuErrors = [];

    rep.stage = "scene";
    // ⚠️ 把**完整参数串**回报回去。第一版只回了网格，服务端只能"猜"参数
    //    （按网格反推 grid_long/work_long）—— 结果拿到的是**另一张素材**，
    //    于是逐像素比对 100% 不一致，白追一轮。
    //    参数必须原样重放，不能反推。
    rep.query = qs({});
    const resp = await fetch("/api/scene?" + qs({ parts: "scene,assets" }));
    if (!resp.ok) throw new Error("取场景包失败 HTTP " + resp.status);
    const pack = GpuRenderer.decodePack(await resp.arrayBuffer());
    r.setScene(pack);
    r.setAssets(pack);
    rep.grid = [r.scene.W, r.scene.H];
    // ⚠️ 量一下**解码后的源字节**。这能把"包解错了"与"上传失败了"分开 ——
    //    实测所有 GPU 缓冲都是 0（连只上传不参与计算的 base/far 也是），
    //    光看 GPU 侧分不清是哪一种。
    rep.srcStats = {};
    for (const k in pack.segs) {
      const u8 = pack.segs[k];
      // ⚠️ 先 `slice()` 复制一份再用 Float32Array 视图。
      //    直接 `new Float32Array(u8.buffer, u8.byteOffset, n)` 要求
      //    byteOffset 是 4 的倍数 —— 而**服务端刚修好这个**（头部与每段都补齐），
      //    所以这里本不该不对齐。回报 byte_off 是为了**确认**服务端真的是新代码，
      //    而不是继续猜。
      const copy = u8.slice();
      const f = new Float32Array(copy.buffer, 0, Math.floor(copy.byteLength / 4));
      let mn = Infinity, mx = -Infinity, sum = 0, nz = 0;
      for (let i = 0; i < f.length; i++) {
        const v = f[i];
        if (v < mn) mn = v; if (v > mx) mx = v; sum += v;
        if (v !== 0) nz++;
      }
      rep.srcStats[k] = { bytes: u8.byteLength, n: f.length,
        byte_off: u8.byteOffset, align4: (u8.byteOffset % 4 === 0),
        min: +mn.toFixed(5), max: +mx.toFixed(5),
        mean: +(sum / f.length).toFixed(5),
        nonzero_pct: +(100 * nz / f.length).toFixed(2) };
    }
    rep.palette_len = pack.meta.palette_len;
    rep.dust_count = pack.meta.dust_count;
    rep.bloom_kernels = pack.meta.bloom_kernels_total;

    rep.stage = "render";
    // 先渲一次确认链能跑
    if (!r.render(P, 0)) throw new Error("render() 返回 false");

    rep.stage = "readback";
    const bytes = r.scene.npix * 4;
    const rb = r.dev.createBuffer({
      size: bytes, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const shot = async (t) => {
      r.render(P, t);
      const enc = r.dev.createCommandEncoder();
      enc.copyBufferToBuffer(r.buf.packed, 0, rb, 0, bytes);
      r.dev.queue.submit([enc.finish()]);
      await r.dev.queue.onSubmittedWorkDone();
      await rb.mapAsync(GPUMapMode.READ);
      const a = new Uint8Array(rb.getMappedRange().slice(0));
      rb.unmap();
      return a;
    };
    const f0 = await shot(0.0);
    const f1 = await shot(1.0);
    rep.stage = "loopcheck";
    let mx = 0;
    for (let i = 0; i < f0.length; i++){
      const d = Math.abs(f0[i] - f1[i]);
      if (d > mx) mx = d;
    }
    rep.loop_max_diff = mx;
    rep.loop_ok = (mx === 0);

    // 再看 t=0.37 那一帧（非平凡时刻），把它回传做逐像素比对
    //
    // ⚠️ 同时回传**中间量**（尘埃后 / 辉光后）。只比最终 u8 的话，
    //    70% 的像素差 1 个色阶这种形态分不清是"整条链都差一点"还是
    //    "某一阶段差得多、被色板边界放大了"。逐阶段比才能定位。
    const shotBuf = async (buf, nBytes) => {
      const tb = r.dev.createBuffer({
        size: nBytes, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      r.render(P, 0.37);
      const e3 = r.dev.createCommandEncoder();
      e3.copyBufferToBuffer(buf, 0, tb, 0, nBytes);
      r.dev.queue.submit([e3.finish()]);
      await r.dev.queue.onSubmittedWorkDone();
      await tb.mapAsync(GPUMapMode.READ);
      const a = new Uint8Array(tb.getMappedRange().slice(0));
      tb.unmap(); tb.destroy();
      return a;
    };
    rep.mid_lit_b64 = _b64(await shotBuf(r.buf.lit, r.scene.n3 * 4));
    rep.mid_dusted_b64 = _b64(await shotBuf(r.buf.dusted, r.scene.n3 * 4));
    rep.mid_composed_b64 = _b64(await shotBuf(r.buf.composed, r.scene.n3 * 4));

    const f37 = await shot(0.37);
    // ⭐ 中间量诊断：把每个阶段的关键缓冲读回来报统计。
    //
    // ⚠️ 这一步是必需的，不是可选调试。实测第一次跑通时浏览器输出**全黑**，
    //    但 render() 返回 true、循环也"逐位相同"（黑 == 黑）——
    //    没有中间量就只能瞎猜是十个 pass 里的哪一个坏的。
    //    有了它，一眼看出断在哪。
    rep.stage = "diag";
    const diag = {};
    for (const nm of ["base", "far", "palette", "a", "lit", "dusted",
                      "bright", "acc", "composed", "packed"]) {
      const buf = r.buf[nm];
      if (!buf) { diag[nm] = "（无此缓冲）"; continue; }
      const sz = buf.size;
      const n = Math.min(sz, 4 * 1024 * 1024);
      const tb = r.dev.createBuffer({
        size: n, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      const e2 = r.dev.createCommandEncoder();
      e2.copyBufferToBuffer(buf, 0, tb, 0, n);
      r.dev.queue.submit([e2.finish()]);
      await r.dev.queue.onSubmittedWorkDone();
      await tb.mapAsync(GPUMapMode.READ);
      const arr = new Float32Array(tb.getMappedRange().slice(0));
      tb.unmap(); tb.destroy();
      let mn = Infinity, mx = -Infinity, sum = 0, nz = 0;
      for (let i = 0; i < arr.length; i++) {
        const v = arr[i];
        if (!isFinite(v)) { diag[nm] = "含 NaN/Inf"; break; }
        if (v < mn) mn = v; if (v > mx) mx = v; sum += v;
        if (v !== 0) nz++;
      }
      if (typeof diag[nm] !== "string") {
        diag[nm] = {
          bytes: sz,
          min: +mn.toFixed(5), max: +mx.toFixed(5),
          mean: +(sum / arr.length).toFixed(5),
          nonzero_pct: +(100 * nz / arr.length).toFixed(2)
        };
      }
    }
    rep.diag = diag;

    // 收错误 scope
    rep.stage = "errorscopes";
    const eOom = await r.dev.popErrorScope();
    const eVal = await r.dev.popErrorScope();
    if (eOom) rep.gpuErrors.push("OOM: " + eOom.message);
    if (eVal) rep.gpuErrors.push("validation: " + eVal.message);

    rep.stage = "encode";
    rep.frame37_b64 = _b64(f37);
    rep.frame37_bytes = f37.length;
    // 简单校验和，方便脚本粗比
    let sum = 0; for (let i = 0; i < f37.length; i++) sum = (sum + f37[i]) >>> 0;
    rep.frame37_sum = sum;

    rep.stage = "done";
    rep.ok = true;
  } catch (e){
    rep.reason = (e && e.message) ? e.message : String(e);
    rep.err = String(e);
  }
  try{
    await fetch("/api/params", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: "_webgpu_selftest", params: rep })
    });
  } catch (e){ /* 服务端拿不到就算了 */ }
  document.title = "SELFTEST:" + (rep.ok ? "OK" : "FAIL:" + (rep.reason || "?"));
  return rep;
}

(async function init(){
  P = Object.assign({}, DEFAULTS);
  defaults = Object.assign({}, DEFAULTS);

  ps("init:start");
  psScopeProbe();
  await loadAssets();
  ps("init:loadAssets done");
  bindUpload();
  buildRail();
  fillSweepKeys();
  $("asset").onchange = () => { syncPicker(); sceneStale = true; refreshMeta(); renderPreview(); if (debugOn()) setTimeout(refreshDebug, 400); };
  ["dbgDepth", "dbgLuma", "dbgVol"].forEach(id => { $(id).onchange = refreshDebug; });

  $("btnPreview").onclick = renderPreview;
  $("showMarker").onchange = updateMarker;
  $("btnLang").onclick = () => {
    LANG = (LANG === "en") ? "zh" : "en";
    try { localStorage.setItem("pa_lang", LANG); } catch (e2) {}
    applyLang();
  };
  if (LANG !== "zh") applyLang();          // 上次选了英文 → 载入即切换
  $("btnZoomIn").onclick = () => zoomBy(1);
  $("btnZoomOut").onclick = () => zoomBy(-1);
  $("btnZoomFit").onclick = () => setZoom(fitZoom(), false);
  bindZoom();
  bindPan();
  window.addEventListener("resize", updateMarker);
  $("btnReset").onclick = () => { P = Object.assign({}, defaults); buildRail(); sceneStale = true; renderPreview(); };
  $("btnExport").onclick = doExport;
  $("btnSave").onclick = saveParams;
  $("btnLoad").onclick = loadParams;
  $("btnSweep").onclick = doSweep;
  initRoHeight();
  $("btnPlay").onclick = onPlayClick;
  $("scrub").oninput = () => { stopPlay(); cur = +$("scrub").value;
    // 参数变了（frames 失效）就按需渲这一帧的单帧，而不是放旧帧
    if (framesValid && frames[cur]) $("frame").src = frames[cur];
    else renderStillOnly();
    $("plate").textContent = `${tr("帧")} ${cur} / ${Math.max(0, frameCount - 1)}`;
    $("scrubT").textContent = "t = " + (cur / Math.max(1, frameCount)).toFixed(2); };


  // ⭐ `?selftest=1` 时**只跑自检，然后结束** —— 不要继续走正常启动流程。
  //
  // ⚠️ 曾经是"跑自检 + 照常启动"，结果是两者**并发**，互相破坏：
  //    · 两边都调 initBackend → 两个 device 抢同一个 canvas
  //      → "TextureView is associated with [Device]" → command buffer 被丢弃
  //    · 正常流程的 gpuEnsureScene 会 `_destroyAll()` —— 把自检刚建好、
  //      刚上传完数据的缓冲**全销毁重建**，于是自检读回来全是 0
  //      （连 base/far 都是 0，让人误以为"上传失败"，实测白追了一轮）
  //
  //    自检是**独立路径**，就该独立跑完。共用状态只会让两边都不可信。
  if (location.search.indexOf("selftest=1") >= 0){
    await runGpuSelfTest();
    return;
  }

  // ⚠️ 只在**还没有任何渲染在进行**时设置这句文案。
  //    原实现无条件覆盖 —— 而 `init()` 早先已经发起过一次渲染（走服务端路径，
  //    可能正在跑几十秒），于是这里把"重建场景中…"盖回成"首次渲染需要…"，
  //    **用户看到的进度提示与实际进展脱节**（实测截图就是这个形态）。
  if (!busy){
    $("badge").textContent = "首次渲染需要跑一次深度推理…";
    $("badge").classList.add("on", "busy");
  }
  $("btnBackend").onclick = async () => {
    // ⚠️ 两个方向的文案都要说清"点了会发生什么" ——
    //    之前只写"点此恢复自动"，用户不知道"自动"就是 GPU。
    backendPref = (backendPref === 'server') ? 'auto' : 'server';
    if (backendPref === 'server'){
      stopPlay();                     // ⚠️ GPU 播放循环靠 backendActive() 存活，切走必须先停
      gpuReady = false;
      $("stagebox").classList.remove("gpu");
      gpuBtn("server", "后端：服务端 · 点此启用 GPU", "当前用服务端渲染（CPU）。点一下改用浏览器里的 WebGPU");
      toast("已切到服务端渲染（CPU）", "ok");
    } else {
      busyBadge("开启 WebGPU…");
      await initBackend();
      if (gpuReady){
        gpuSceneKey = "";             // 强制重传场景
        $("stagebox").classList.add("gpu");
        toast("已切到 GPU 渲染（" + gpuInfo + "）", "ok");
      } else {
        backendPref = 'server';       // 开不出来就留在服务端，别停在半开状态
        toast("这台浏览器拿不到 WebGPU，保持服务端渲染", "bad");
      }
    }
    sceneStale = true;
    renderPreview();
  };
  // 先取逻辑尺寸把取景框定准，再渲首图 —— 否则首屏会先按错误尺寸闪一下
  ps("init:进入后端初始化");
  refreshMeta()
    .then(() => { ps("refreshMeta done"); return initBackend(); })
    .then(() => { ps("initBackend done", { gpuReady: gpuReady, info: gpuInfo });
                  return renderPreview(); })
    .then(() => { ps("首图完成");
                   if (location.search.indexOf("probe=ui") >= 0) runUiProbe(); })
    .catch((e) => { psErr("startup-chain", (e && e.stack) || e); });
})();
</script>
